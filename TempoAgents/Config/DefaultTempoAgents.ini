[CoreRedirects]
; TempoAgentsShared collapsed into TempoAgents; TempoMapQuery (formerly its own
; module under TempoWorld) absorbed into TempoAgents in v2.
+PackageRedirects=(OldName="/Script/TempoAgentsShared",NewName="/Script/TempoAgents")
+PackageRedirects=(OldName="/Script/TempoMapQuery",NewName="/Script/TempoAgents")
; Lane connection candidates were once declared in Tempo's modified build of the engine's ZoneGraph plugin.
+StructRedirects=(OldName="/Script/ZoneGraph.LaneConnectionCandidate",NewName="/Script/TempoAgents.TempoLaneConnectionCandidate")
; Zone shapes saved with the routing type Tempo's modified ZoneGraph added get the engine's Bezier, which Tempo routes the same way.
+EnumRedirects=(OldName="/Script/ZoneGraph.EZoneShapePolygonRoutingType",ValueChanges=(("TempoBezier","Bezier")))

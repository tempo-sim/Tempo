syntax = "proto3";

import "TempoSensors/Common.proto";

// Generic [min, max] interval. Units are carried by the field that uses this type.
message Range {
  float min = 1;
  float max = 2;
}

// Which echo a beam reports when more than one is detected, e.g. a dust cloud in front of a wall.
// Set on the lidar component (`ReturnMode`); reported in `LidarScanSegment.return_mode`.
enum LidarReturnMode {
  // One return per beam: the echo with the highest intensity.
  LRM_STRONGEST = 0;
  // One return per beam: the nearest detectable echo.
  LRM_FIRST = 1;
  // One return per beam: the farthest detectable echo.
  LRM_LAST = 2;
  // Two returns per beam: the strongest echo in the segment's top-level arrays and the other
  // detectable echo, if any, in the `second_*` arrays.
  LRM_DUAL = 3;
}

message LidarScanSegment {
  TempoSensors.MeasurementHeader header = 1;
  // Total number of segments that comprise one full scan (segments share a sequence_id).
  int32 scan_count = 2;
  // Number of vertical beams (rows) in this segment.
  int32 vertical_beams = 3;
  // Number of horizontal beams (columns) in this segment.
  int32 horizontal_beams = 4;
  // Min/max measurable range in meters.
  Range distance_range_m = 5;
  // Azimuth sweep covered by this segment, in radians (right-handed, sign per Tempo lidar convention).
  Range azimuth_range_rad = 6;
  // Elevation sweep covered by this segment, in radians (right-handed, sign per Tempo lidar convention).
  Range elevation_range_rad = 7;
  // Per-return distance to the hit, in meters. 0 = no return. Packed H-outer, V-inner. Opaque blob of
  // little-endian float32, 4 bytes per return; length is 4 * horizontal_beams * vertical_beams. Carried
  // as bytes rather than `repeated float` so clients reinterpret the buffer directly instead of paying a
  // per-element decode cost.
  bytes distances_m = 8;
  // Per-return reflected intensity in [0, 1]. Same layout/encoding as `distances_m` (little-endian float32).
  bytes intensities = 9;
  // Per-return label (0 if labels disabled or the return is unlabeled). A surface return carries its
  // surface's label; an echo from participating media (fog, dust, smoke) carries the label of the
  // medium, as the label table assigns it to the medium's primitive or fog actor. Same H-outer/V-inner
  // layout as `distances_m`, but packed little-endian uint32 (4 bytes per return); length is
  // 4 * horizontal_beams * vertical_beams.
  bytes labels = 10;
  // Per-return azimuth in radians. Same layout/encoding as `distances_m` (little-endian float32).
  bytes azimuths_rad = 11;
  // Per-return elevation in radians. Same layout/encoding as `distances_m` (little-endian float32).
  bytes elevations_rad = 12;
  // Per-return packed 8-bit color, 3 bytes per return. Empty when color rendering is disabled
  // (no client has requested `include_color`). When non-empty, length is 3 * horizontal_beams *
  // vertical_beams and byte ordering is given by `color_encoding`. Per-return color for return
  // (h, v) occupies bytes [3 * (h * vertical_beams + v), 3 * (h * vertical_beams + v) + 3).
  bytes colors = 13;
  // Byte ordering of `colors`. CE_UNKNOWN when `colors` is empty.
  TempoSensors.ColorEncoding color_encoding = 14;
  // Per-return surface reflectivity estimate, 1 byte per return in [0, 255] (0 = least
  // reflective). Derived from material PBR properties (base color, metallic, specular, roughness)
  // by the lidar post-process material; it is an estimate, not a calibrated NIR reflectance.
  // Always populated, in both color and no-color modes. Same H-outer/V-inner layout as
  // `distances_m`: reflectivity for return (h, v) is byte (h * vertical_beams + v). Length is
  // horizontal_beams * vertical_beams.
  bytes reflectivities = 15;
  // The return mode the lidar was in when this segment was produced. Says which echo the top-level
  // arrays hold when a beam detects more than one (see LidarReturnMode). Segments from a lidar
  // without participating-media simulation carry at most one echo per beam, so every mode reports
  // the same returns.
  LidarReturnMode return_mode = 16;
  // The second echo per beam. Only populated in LRM_DUAL mode; empty otherwise. Where a beam has
  // both a participating-media echo (dust, smoke, fog) and a surface echo, the stronger of the two
  // is in the top-level arrays and the other is here. Same layout and encoding as `distances_m`;
  // 0 = no second echo for that beam. Beams share the segment's azimuths and elevations.
  bytes second_distances_m = 17;
  // Same layout and encoding as `intensities`.
  bytes second_intensities = 18;
  // Same layout and encoding as `labels`.
  bytes second_labels = 19;
  // Same layout and encoding as `reflectivities`.
  bytes second_reflectivities = 20;
}

message LidarScanRequest {
  // Name of the actor that owns the sensor.
  string owner = 1;
  // Name of the sensor component on the owning actor.
  string sensor = 2;
  // When true, request that the server enable color rendering on this lidar and populate
  // `colors` in returned segments. The first such request flips the sensor into color mode
  // (drains in-flight reads, swaps the render path); the mode is held until no pending request
  // sets this flag. The toggle has a real GPU cost — color mode uses Lumen + ray tracing.
  bool include_color = 3;
}

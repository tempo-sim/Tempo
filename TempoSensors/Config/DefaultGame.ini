[/Script/UnrealEd.ProjectPackagingSettings]
; Cook this plugin's whole content directory.
;
; Everything TempoSensors needs at runtime — the camera and lidar post-process materials, the
; stitch materials, the distortion map, the semantic label table — is reachable only through
; TSoftObjectPtr fields on UTempoSensorsSettings. The cooker walks hard references from the maps it
; is given and never sees a soft path held by a config-backed settings object, so without this none
; of it is cooked at all. Owning the rule here rather than in a host project means enabling the
; plugin is enough.
;
; A "/"-rooted path is resolved against the mounted roots, so this picks up the plugin's own content
; directory rather than anything under the project. Naming the plugin root rather than individual
; subdirectories also covers content added later.
;
; NOTE: this is necessary but NOT sufficient under iostore (bUseIoStore=True). These assets cook and
; stage, but the iostore container build drops them again because they still have no hard reference
; chain — AllChunksInfo.csv labels them "Soft: Unknown reference chain. Soft From Unassigned
; Package?" — and the runtime loader then reports
;   LoadPackage: SkipPackage: /TempoSensors/Materials/M_TempoCamera_Distort_NoDepth ... does not
;   exist on disk or in the loader
;   PostProcessMaterialNoDepth is not set in TempoSensors settings
; with the camera producing no usable imagery. Packaging with -skipiostore avoids it; giving the
; assets a real reference chain (AssetManager primary asset rules) fixes it with iostore left on.
+DirectoriesToAlwaysCook=(Path="/TempoSensors")

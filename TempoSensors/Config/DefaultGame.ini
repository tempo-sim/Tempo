[/Script/UnrealEd.ProjectPackagingSettings]
; The sensor readback tests (Tests/Python/test_sensor_readback.py) drive a level that ships with
; this plugin. Nothing in a host project references it, and the cook only walks references from the
; maps it is given, so without this the map is absent from packaged builds and the tests can only
; skip. A "/"-rooted path here is resolved against the mounted roots, so this picks up the plugin's
; own content directory rather than anything under the project.
+DirectoriesToAlwaysCook=(Path="/TempoSensors/Maps")

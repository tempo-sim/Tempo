[ConsoleVariables]
; Submit and retire Vulkan GPU work on the RHI thread instead of UE's dedicated submission/interrupt threads (only created when there are >6 task workers, i.e. ~8+ cores): with them, the sensors' per-tick blocking readbacks trip a VK_DEVICE_FAULT READ_INVALID in the multi-tile camera stitch on UE 5.8 (crash-free with these off). Remove once fixed upstream.
r.Vulkan.Submission.UseInterruptThread=0
r.Vulkan.Submission.UseSubmissionThread=0

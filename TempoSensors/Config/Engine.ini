[ConsoleVariables]
; Submit and retire Vulkan GPU work on the RHI thread instead of UE's dedicated submission/interrupt threads (only created when there are >6 task workers, i.e. ~8+ cores): with them, the sensors' per-tick blocking readbacks trip a VK_DEVICE_FAULT READ_INVALID in the multi-tile camera stitch on UE 5.8 (crash-free with these off). Remove once fixed upstream.
r.Vulkan.Submission.UseInterruptThread=0
r.Vulkan.Submission.UseSubmissionThread=0
; The Vulkan RHI recycles uniform-buffer memory, descriptor pools and buffer-pool pages this many render-thread frames after release with no GPU sync point, on the assumption that a viewport present keeps the GPU within two frames of the render thread. An off-screen process has no present; the sensor subsystem's GPU frame throttle (TempoSensorsSettings.MaxGPUFramesInFlight, default 32) bounds the lag instead, and this must exceed that bound. Measured on a saturated GPU: with the engine default of 2 the GPU ran 30+ frames behind and lost the device in the camera stitch within minutes; with these two settings the lag is capped and throughput is unchanged.
r.Vulkan.NumFramesToWaitForResourceDelete=40

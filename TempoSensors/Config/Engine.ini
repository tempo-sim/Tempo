[ConsoleVariables]
; Submit and retire Vulkan GPU work on the RHI thread instead of UE's dedicated submission/interrupt threads (only created when there are >6 task workers, i.e. ~8+ cores): with them, the sensors' per-tick blocking readbacks trip a VK_DEVICE_FAULT READ_INVALID in the multi-tile camera stitch on UE 5.8 (crash-free with these off). Remove once fixed upstream.
r.Vulkan.Submission.UseInterruptThread=0
r.Vulkan.Submission.UseSubmissionThread=0
; UE 5.8's Vulkan RHI begins a dynamic-rendering render instance with viewMask 0x1 for a multiview count of 1, the default AddDrawTexturePass (ScreenPass.h) passes for the post-process-material copy into each view's capture target, while every graphics pipeline is created with viewMask 0 (FillDynamicRenderingCreateInfo never fills it). Every tile of every sensor frame therefore draws into its atlas in violation of VUID-vkCmdDrawIndexed-viewMask-06178; on fast GPUs and MIG slices the GPU hangs on the next pass over the lidar atlas and the sim loses the device (VK_ERROR_DEVICE_LOST, breadcrumbs stopped at ClearRenderTarget(TempoMultiViewAtlas)). With dynamic rendering off, pipelines are compiled against real render passes that carry the same multiview state, so the two cannot disagree. Vulkan only, read at RHI startup; measured RTF unchanged. Remove once fixed upstream.
r.Vulkan.AllowDynamicRendering=0
; Do not raise r.Vulkan.NumFramesToWaitForResourceDelete here. It holds every freed GPU resource that many frames, so its VRAM cost is the delay times the memory a project frees per frame, and a project that frees a lot per frame can run out of VRAM and spill to host memory. The GPU frame throttle's default bound of 1 is safe against the engine default of 2 (see TempoSensorsSettings.MaxGPUFramesInFlight).

syntax = "proto3";

import "TempoCore/Empty.proto";
import "TempoCore/Geometry.proto";

message SpawnActorRequest {
  // Class name of the actor to spawn. A Blueprint class may be named either by its generated
  // class name ("BP_Foo_C") or by the asset name it reads as in the editor ("BP_Foo").
  string actor_type = 1;
  // If true, defer finishing the spawn until FinishSpawningActor is called.
  bool deferred = 2;
  // Spawn transform (world frame, or relative to `relative_to_actor` if set). Meters / right-handed.
  TempoCore.Transform transform = 3;
  // Optional actor name that `transform` is interpreted relative to.
  string relative_to_actor = 4;
}

message SpawnActorResponse {
  // Name of the spawned actor.
  string name = 1;
  // World transform of the spawned actor after spawning.
  TempoCore.Transform transform = 2;
}

message FinishSpawningActorRequest {
  // Name of the deferred actor to finish spawning.
  string actor = 1;
}

message FinishSpawningActorResponse {
  // World transform of the actor after finishing the spawn.
  TempoCore.Transform transform = 1;
}

message DestroyActorRequest {
  // Name of the actor to destroy.
  string actor = 1;
}

message AddComponentRequest {
  // Class name of the component to add. Named the same way as SpawnActor's actor_type.
  string component_type = 1;
  // Name of the owning actor.
  string actor = 2;
  // Optional name for the new component (auto-generated if empty).
  string name = 3;
  // Optional name of a parent component on the owning actor (empty = attach to root).
  string parent = 4;
  // Local transform of the new component on its parent. Meters / right-handed.
  TempoCore.Transform transform = 5;
  // Optional socket name on `parent` to attach to.
  string socket = 6;
}

message AddComponentResponse {
  // Name of the added component.
  string name = 1;
  // World transform of the component after attachment.
  TempoCore.Transform transform = 2;
}

message DestroyComponentRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to destroy.
  string component = 2;
}

// Partial update: every member below is optional, and one that is not set leaves that part of
// the actor's transform unchanged. Setting none of them is a no-op.
message SetActorTransformRequest {
  // Name of the actor to move.
  string actor = 1;
  // Target location and rotation (world frame, or relative to `relative_to_actor` if set).
  // Meters / radians, right-handed. `transform.location` and `transform.rotation` are honored
  // independently: supply only the rotation to turn the actor without moving it.
  TempoCore.Transform transform = 2;
  // Optional actor name that `transform` is interpreted relative to. `transform` is applied first
  // and that actor's transform second, the same order SpawnActor composes in.
  string relative_to_actor = 3;
  // Optional new world scale. Unitless, so - unlike every other Vector in this API - its
  // components are used as given, with no meters-to-centimeters or handedness conversion.
  // Absolute: unlike `transform`, it is never composed through `relative_to_actor`.
  TempoCore.Vector scale = 4;
}

message SetActorLocationRequest {
  // Name of the actor to move.
  string actor = 1;
  // Target location (world frame, or relative to `relative_to_actor` if set). Meters, right-handed.
  // Required; leaving it unset is an error rather than a move to the origin.
  TempoCore.Vector location = 2;
  // Optional actor name that `location` is interpreted relative to.
  string relative_to_actor = 3;
}

message SetActorRotationRequest {
  // Name of the actor to turn.
  string actor = 1;
  // Target rotation (world frame, or relative to `relative_to_actor` if set). Radians, right-handed.
  // Required; leaving it unset is an error rather than a rotation to identity.
  TempoCore.Rotation rotation = 2;
  // Optional actor name that `rotation` is interpreted relative to.
  string relative_to_actor = 3;
}

message SetActorScale3DRequest {
  // Name of the actor to resize.
  string actor = 1;
  // Target world scale. Unitless: used as given, with no unit or handedness conversion.
  // Required; leaving it unset is an error rather than a collapse to zero.
  TempoCore.Vector scale = 2;
}

// Partial update, exactly as SetActorTransformRequest: an unset member leaves that part of the
// component's transform unchanged.
message SetComponentTransformRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to move.
  string component = 2;
  // Target location and rotation. Meters / radians, right-handed. Honored independently.
  TempoCore.Transform transform = 3;
  // If true, `transform` and `scale` are in world space; otherwise they are relative to the
  // component's parent.
  bool relative_to_world = 4;
  // Optional new scale. Unitless: used as given, with no unit or handedness conversion.
  TempoCore.Vector scale = 5;
}

message SetComponentLocationRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to move.
  string component = 2;
  // Target location. Meters, right-handed. Required.
  TempoCore.Vector location = 3;
  // If true, `location` is in world space; otherwise it is relative to the component's parent.
  bool relative_to_world = 4;
}

message SetComponentRotationRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to turn.
  string component = 2;
  // Target rotation. Radians, right-handed. Required.
  TempoCore.Rotation rotation = 3;
  // If true, `rotation` is in world space; otherwise it is relative to the component's parent.
  bool relative_to_world = 4;
}

message SetComponentScale3DRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to resize.
  string component = 2;
  // Target scale. Unitless: used as given, with no unit or handedness conversion. Required.
  TempoCore.Vector scale = 3;
  // If true, `scale` is in world space; otherwise it is relative to the component's parent.
  bool relative_to_world = 4;
}

message ActivateComponentRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to activate.
  string component = 2;
}

message DeactivateComponentRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to deactivate.
  string component = 2;
}

message ActorDescriptor {
  // Actor name.
  string name = 1;
  // Actor class name, e.g. "BP_Foo_C" for a Blueprint class. Can be passed straight back to SpawnActor.
  string actor_type = 2;
}

message GetAllActorsResponse {
  repeated ActorDescriptor actors = 1;
}

message ComponentDescriptor {
  // Name of the owning actor.
  string actor = 1;
  // Component name.
  string name = 2;
  // Component class name, e.g. "BP_Foo_C" for a Blueprint class. Can be passed straight back to AddComponent.
  string component_type = 3;
}

message GetAllComponentsRequest {
  // Name of the actor whose components to list.
  string actor = 1;
}

message GetAllComponentsResponse {
  repeated ComponentDescriptor components = 1;
}

message GetActorPropertiesRequest {
  // Name of the actor to inspect.
  string actor = 1;
  // If true, also walk components' properties.
  bool include_components = 2;
}

message GetComponentPropertiesRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to inspect.
  string component = 2;
}

message PropertyDescriptor {
  // Name of the owning actor.
  string actor = 1;
  // Name of the owning component (empty for actor-level properties).
  string component = 2;
  // Property name (dot-path for nested struct/array members).
  string name = 3;
  // Property type string (e.g. "bool", "int", "float[]", "vector").
  string property_type = 4;
  // Current property value, serialized as a string.
  string value = 5;
}

message GetPropertiesResponse {
  repeated PropertyDescriptor properties = 1;
}

message SetBoolPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  bool value = 4;
}

message SetStringPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  string value = 4;
}

message SetEnumPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Enum value as its symbolic name.
  string value = 4;
}

message SetIntPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  int32 value = 4;
}

message SetInt64PropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  int64 value = 4;
}

message SetFloatPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  float value = 4;
}

message SetVectorPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  float x = 4;
  float y = 5;
  float z = 6;
}

message SetVector2DPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  float x = 4;
  float y = 5;
}

message SetIntVectorPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  int32 x = 4;
  int32 y = 5;
  int32 z = 6;
}

message SetIntPointPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  int32 x = 4;
  int32 y = 5;
}

message SetRotatorPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Roll in radians.
  float r = 4;
  // Pitch in radians.
  float p = 5;
  // Yaw in radians.
  float y = 6;
}

message SetQuatPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Quaternion components (right-handed convention; will be converted to Unreal's left-handed FQuat).
  float x = 4;
  float y = 5;
  float z = 6;
  float w = 7;
}

message SetTransformPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Transform (meters / right-handed). Location is converted m -> cm and rotation rad -> deg, right-handed -> left-handed.
  TempoCore.Transform value = 4;
}

message SetColorPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // 8-bit RGB components in [0, 255].
  int32 r = 4;
  int32 g = 5;
  int32 b = 6;
}

message SetClassPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Class path or name. Named the same way as SpawnActor's actor_type.
  string value = 4;
}

message SetAssetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Asset path or name.
  string value = 4;
}

message SetActorPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Name of the referenced actor.
  string value = 4;
}

message SetComponentPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Name of the referenced component (on the same actor).
  string value = 4;
}

message SetBoolArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated bool values = 4;
}

message SetStringArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetEnumArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetIntArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated int32 values = 4;
}

message SetInt64ArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated int64 values = 4;
}

message SetFloatArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated float values = 4;
}

message SetClassArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Class paths or names. Named the same way as SpawnActor's actor_type.
  repeated string values = 4;
}

message SetAssetArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetActorArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetComponentArrayPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

// Set RPCs replace the entire contents of a TSet property with the provided values.
// (Duplicates among `values` collapse, matching TSet semantics.)
message SetBoolSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated bool values = 4;
}

message SetStringSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetEnumSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetIntSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated int32 values = 4;
}

message SetInt64SetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated int64 values = 4;
}

message SetFloatSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated float values = 4;
}

message SetClassSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // Class paths or names. Named the same way as SpawnActor's actor_type.
  repeated string values = 4;
}

message SetAssetSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetActorSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

message SetComponentSetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  repeated string values = 4;
}

// Element wrappers for the repeated variants of `Value`. proto3 does not allow
// `repeated` fields directly inside a oneof, so each repeated variant needs a
// single-field wrapper message.
message BoolArray { repeated bool values = 1; }
message IntArray { repeated int32 values = 1; }
message Int64Array { repeated int64 values = 1; }
message FloatArray { repeated float values = 1; }
message StringArray { repeated string values = 1; }

// Value-shaped counterparts of the flattened fields on the Set*PropertyRequest
// messages. A oneof variant must be a single field, so the scalar components
// these types carry are grouped into a message.
message IntVector {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message IntPoint {
  int32 x = 1;
  int32 y = 2;
}

message Quat {
  // Right-handed convention; converted to Unreal's left-handed FQuat.
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message Color {
  // 8-bit RGB components in [0, 255].
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
}

// One typed value, independent of what it is assigned to. Used by SetProperty
// as a property's new value and by CallFunction as an argument's value.
//
// The variant selects how the value is interpreted and which Unreal property
// types it may be written to - exactly the same rules the singular
// Set*Property RPCs follow, since they are now expressed in terms of this
// message. See the README's property type table.
message Value {
  oneof value {
    bool bool_value = 1;
    int32 int_value = 2;
    int64 int64_value = 3;
    float float_value = 4;
    string string_value = 5;
    // Enum value as its symbolic name.
    string enum_value = 6;
    TempoCore.Vector vector_value = 7;
    TempoCore.Vector2D vector2d_value = 8;
    IntVector int_vector_value = 9;
    IntPoint int_point_value = 10;
    // Roll/pitch/yaw in radians, right-handed.
    TempoCore.Rotation rotator_value = 11;
    Quat quat_value = 12;
    // Location in meters, rotation in radians, right-handed.
    TempoCore.Transform transform_value = 13;
    Color color_value = 14;
    // Class path or name. Named the same way as SpawnActor's actor_type.
    string class_value = 15;
    // Asset path or name.
    string asset_value = 16;
    // Name of the referenced actor.
    string actor_value = 17;
    // Name of the referenced component, as "ActorName:ComponentName".
    string component_value = 18;
    BoolArray bool_array_value = 19;
    StringArray string_array_value = 20;
    StringArray enum_array_value = 21;
    IntArray int_array_value = 22;
    Int64Array int64_array_value = 23;
    FloatArray float_array_value = 24;
    StringArray class_array_value = 25;
    StringArray asset_array_value = 26;
    StringArray actor_array_value = 27;
    StringArray component_array_value = 28;
    BoolArray bool_set_value = 29;
    StringArray string_set_value = 30;
    StringArray enum_set_value = 31;
    IntArray int_set_value = 32;
    Int64Array int64_set_value = 33;
    FloatArray float_set_value = 34;
    StringArray class_set_value = 35;
    StringArray asset_set_value = 36;
    StringArray actor_set_value = 37;
    StringArray component_set_value = 38;
  }
}

// Generic form of the singular Set*Property RPCs: one request that carries the
// value's type in the value itself rather than in the RPC name.
message SetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  Value value = 4;
}

// One argument to CallFunction.
message FunctionArg {
  // Parameter name. Supports the same nested addressing as property names:
  // "MyStruct.Inner", "MyArray[0]", "MyMap[key]".
  string name = 1;
  Value value = 2;
}

message CallFunctionRequest {
  string actor = 1;
  string component = 2;
  // Name of the UFUNCTION to invoke.
  string function = 3;
  // One entry per parameter. Every input parameter of the function must be
  // supplied; out parameters and the return value must not be. Args are
  // applied in order.
  repeated FunctionArg args = 4;
}

// One value a function handed back: its return value or an out parameter.
message FunctionResult {
  // Parameter name. Unreal names a return value "ReturnValue".
  string name = 1;
  // Property type string, from the same vocabulary as PropertyDescriptor.property_type.
  string property_type = 2;
  // The value, serialized as a string the same way GetProperties serializes a
  // property's value.
  string value = 3;
}

message CallFunctionResponse {
  // The function's return value and any out parameters, in declaration order.
  // Empty for a void function with no out parameters.
  repeated FunctionResult results = 1;
}

// How a function parameter is passed.
enum ParameterKind {
  PK_UNKNOWN = 0;
  // An input the caller must supply to CallFunction.
  PK_INPUT = 1;
  // A value the function hands back. Must not be supplied.
  PK_OUTPUT = 2;
  // The function's return value. Must not be supplied.
  PK_RETURN = 3;
}

// One parameter of a function, including its out parameters and return value.
message ParameterDescriptor {
  // Parameter name, spelled the way CallFunction's FunctionArg.name expects it.
  // Unreal names a return value "ReturnValue".
  string name = 1;
  // Property type string, from the same vocabulary as PropertyDescriptor.property_type.
  // "unsupported" for a type this API cannot express.
  string property_type = 2;
  // How the parameter is passed.
  ParameterKind kind = 3;
}

message FunctionDescriptor {
  // Name of the owning actor.
  string actor = 1;
  // Name of the owning component (empty for actor-level functions).
  string component = 2;
  // Function name, spelled the way CallFunction's `function` expects it.
  string name = 3;
  // The whole signature as one string, the way the declaration reads, e.g.
  // "float GetDistanceTo(AActor* OtherActor)". Types come from the same vocabulary as
  // PropertyDescriptor.property_type, and out parameters are prefixed with "out ".
  string signature = 4;
  // The same information, split up: one entry per parameter, in declaration order.
  repeated ParameterDescriptor parameters = 5;
  // False if CallFunction cannot invoke this function (see `error`).
  bool callable = 6;
  // Why the function is not callable. Empty when `callable` is true.
  string error = 7;
}

message GetFunctionsResponse {
  repeated FunctionDescriptor functions = 1;
}

message GetActorFunctionsRequest {
  // Name of the actor to inspect.
  string actor = 1;
  // If true, also walk components' functions.
  bool include_components = 2;
}

message GetComponentFunctionsRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to inspect.
  string component = 2;
}

// One operation in a SetProperties batch. The oneof selects which set-property
// operation to perform; each variant is the same Set*PropertyRequest message
// that the corresponding singular RPC accepts.
message SetPropertyOp {
  oneof op {
    SetBoolPropertyRequest bool_op = 1;
    SetIntPropertyRequest int_op = 2;
    SetInt64PropertyRequest int64_op = 3;
    SetFloatPropertyRequest float_op = 4;
    SetStringPropertyRequest string_op = 5;
    SetEnumPropertyRequest enum_op = 6;
    SetVectorPropertyRequest vector_op = 7;
    SetVector2DPropertyRequest vector2d_op = 8;
    SetIntVectorPropertyRequest int_vector_op = 9;
    SetIntPointPropertyRequest int_point_op = 10;
    SetRotatorPropertyRequest rotator_op = 11;
    SetQuatPropertyRequest quat_op = 12;
    SetTransformPropertyRequest transform_op = 13;
    SetColorPropertyRequest color_op = 14;
    SetClassPropertyRequest class_op = 15;
    SetAssetPropertyRequest asset_op = 16;
    SetActorPropertyRequest actor_op = 17;
    SetComponentPropertyRequest component_op = 18;
    SetBoolArrayPropertyRequest bool_array_op = 19;
    SetStringArrayPropertyRequest string_array_op = 20;
    SetEnumArrayPropertyRequest enum_array_op = 21;
    SetIntArrayPropertyRequest int_array_op = 22;
    SetInt64ArrayPropertyRequest int64_array_op = 23;
    SetFloatArrayPropertyRequest float_array_op = 24;
    SetClassArrayPropertyRequest class_array_op = 25;
    SetAssetArrayPropertyRequest asset_array_op = 26;
    SetActorArrayPropertyRequest actor_array_op = 27;
    SetComponentArrayPropertyRequest component_array_op = 28;
    SetBoolSetPropertyRequest bool_set_op = 29;
    SetStringSetPropertyRequest string_set_op = 30;
    SetEnumSetPropertyRequest enum_set_op = 31;
    SetIntSetPropertyRequest int_set_op = 32;
    SetInt64SetPropertyRequest int64_set_op = 33;
    SetFloatSetPropertyRequest float_set_op = 34;
    SetClassSetPropertyRequest class_set_op = 35;
    SetAssetSetPropertyRequest asset_set_op = 36;
    SetActorSetPropertyRequest actor_set_op = 37;
    SetComponentSetPropertyRequest component_set_op = 38;
  }
}

// Result for a single op in a SetProperties batch. Only failed ops are
// returned in the response; an empty `failures` list means every op succeeded.
message SetPropertyResult {
  // Zero-based index into the request's `ops` list.
  uint32 op_index = 1;
  // gRPC status code (see grpc::StatusCode); never 0 (OK) here.
  int32 code = 2;
  // Human-readable error message.
  string error = 3;
}

message SetPropertiesRequest {
  repeated SetPropertyOp ops = 1;
}

message SetPropertiesResponse {
  // One entry per failed op (in request order). Empty if all ops succeeded.
  repeated SetPropertyResult failures = 1;
}

service WorldControlService {
  rpc SpawnActor(SpawnActorRequest) returns (SpawnActorResponse);

  rpc FinishSpawningActor(FinishSpawningActorRequest) returns (FinishSpawningActorResponse);

  rpc DestroyActor(DestroyActorRequest) returns (TempoCore.Empty);

  rpc AddComponent(AddComponentRequest) returns (AddComponentResponse);

  rpc DestroyComponent(DestroyComponentRequest) returns (TempoCore.Empty);

  rpc SetActorTransform(SetActorTransformRequest) returns (TempoCore.Empty);

  rpc SetActorLocation(SetActorLocationRequest) returns (TempoCore.Empty);

  rpc SetActorRotation(SetActorRotationRequest) returns (TempoCore.Empty);

  rpc SetActorScale3D(SetActorScale3DRequest) returns (TempoCore.Empty);

  rpc SetComponentTransform(SetComponentTransformRequest) returns (TempoCore.Empty);

  rpc SetComponentLocation(SetComponentLocationRequest) returns (TempoCore.Empty);

  rpc SetComponentRotation(SetComponentRotationRequest) returns (TempoCore.Empty);

  rpc SetComponentScale3D(SetComponentScale3DRequest) returns (TempoCore.Empty);

  rpc ActivateComponent(ActivateComponentRequest) returns (TempoCore.Empty);

  rpc DeactivateComponent(DeactivateComponentRequest) returns (TempoCore.Empty);

  rpc GetAllActors(TempoCore.Empty) returns (GetAllActorsResponse);

  rpc GetAllComponents(GetAllComponentsRequest) returns (GetAllComponentsResponse);

  rpc GetActorProperties(GetActorPropertiesRequest) returns (GetPropertiesResponse);

  rpc GetComponentProperties(GetComponentPropertiesRequest) returns (GetPropertiesResponse);

  rpc SetBoolProperty(SetBoolPropertyRequest) returns (TempoCore.Empty);

  rpc SetStringProperty(SetStringPropertyRequest) returns (TempoCore.Empty);

  rpc SetEnumProperty(SetEnumPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntProperty(SetIntPropertyRequest) returns (TempoCore.Empty);

  rpc SetInt64Property(SetInt64PropertyRequest) returns (TempoCore.Empty);

  rpc SetFloatProperty(SetFloatPropertyRequest) returns (TempoCore.Empty);

  rpc SetVectorProperty(SetVectorPropertyRequest) returns (TempoCore.Empty);

  rpc SetVector2DProperty(SetVector2DPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntVectorProperty(SetIntVectorPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntPointProperty(SetIntPointPropertyRequest) returns (TempoCore.Empty);

  rpc SetRotatorProperty(SetRotatorPropertyRequest) returns (TempoCore.Empty);

  rpc SetQuatProperty(SetQuatPropertyRequest) returns (TempoCore.Empty);

  rpc SetTransformProperty(SetTransformPropertyRequest) returns (TempoCore.Empty);

  rpc SetColorProperty(SetColorPropertyRequest) returns (TempoCore.Empty);

  rpc SetClassProperty(SetClassPropertyRequest) returns (TempoCore.Empty);

  rpc SetAssetProperty(SetAssetPropertyRequest) returns (TempoCore.Empty);


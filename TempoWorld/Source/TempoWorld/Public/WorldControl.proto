// Element wrappers for the repeated variants of `Value`. proto3 does not allow
// `repeated` fields directly inside a oneof, so each repeated variant needs a
// single-field wrapper message.
message BoolArray { repeated bool values = 1; }
message IntArray { repeated int32 values = 1; }
message Int64Array { repeated int64 values = 1; }
message FloatArray { repeated float values = 1; }
message StringArray { repeated string values = 1; }

// Value-shaped counterparts of the flattened fields on the Set*PropertyRequest
// messages. A oneof variant must be a single field, so the scalar components
// these types carry are grouped into a message.
message IntVector {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message IntPoint {
  int32 x = 1;
  int32 y = 2;
}

message Quat {
  // Right-handed convention; converted to Unreal's left-handed FQuat.
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message Color {
  // 8-bit RGB components in [0, 255].
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
}

// A struct with no first-class representation, as its members.
//
// A struct is carried this way only when every member it has can itself be carried as a Value, so
// a read reports the whole struct. A struct with a map, a weak reference or a fixed-size array
// among its members is not, and is reachable only a member at a time, by nested address.
message StructValue {
  // The struct's C++ name, e.g. "FHitResult" -- the name DescribeClasses reports it under. A write
  // fails when the destination is a different struct. Empty accepts any struct.
  string struct_name = 1;
  // A write sets only the members present and leaves the rest as they were: a property keeps its
  // current values, and a function parameter keeps its defaults. A read reports every member, in
  // declaration order. A member named twice is written twice, in order.
  repeated StructField fields = 2;
}

// One member of a StructValue.
message StructField {
  // The member's authored name, which is how a nested address names it too.
  string name = 1;
  Value value = 2;
}

message StructArray { repeated StructValue values = 1; }

// One typed value, independent of what it is assigned to. Used by SetProperty
// as a property's new value and by CallFunction as an argument's value.
//
// The variant selects how the value is interpreted and which Unreal property
// types it may be written to - exactly the same rules the singular
// Set*Property RPCs follow, since they are now expressed in terms of this
// message. See the README's property type table.
message Value {
  oneof value {
    bool bool_value = 1;
    int32 int_value = 2;
    int64 int64_value = 3;
    float float_value = 4;
    string string_value = 5;
    // Enum value as its symbolic name.
    string enum_value = 6;
    TempoCore.Vector vector_value = 7;
    TempoCore.Vector2D vector2d_value = 8;
    IntVector int_vector_value = 9;
    IntPoint int_point_value = 10;
    // Roll/pitch/yaw in radians, right-handed.
    TempoCore.Rotation rotator_value = 11;
    Quat quat_value = 12;
    // Location in meters, rotation in radians, right-handed.
    TempoCore.Transform transform_value = 13;
    Color color_value = 14;
    // Class path or name. Named the same way as SpawnActor's actor_type.
    string class_value = 15;
    // Asset path or name.
    string asset_value = 16;
    // Name of the referenced actor.
    string actor_value = 17;
    // Name of the referenced component, as "ActorName:ComponentName".
    string component_value = 18;
    BoolArray bool_array_value = 19;
    StringArray string_array_value = 20;
    StringArray enum_array_value = 21;
    IntArray int_array_value = 22;
    Int64Array int64_array_value = 23;
    FloatArray float_array_value = 24;
    StringArray class_array_value = 25;
    StringArray asset_array_value = 26;
    StringArray actor_array_value = 27;
    StringArray component_array_value = 28;
    BoolArray bool_set_value = 29;
    StringArray string_set_value = 30;
    StringArray enum_set_value = 31;
    IntArray int_set_value = 32;
    Int64Array int64_set_value = 33;
    FloatArray float_set_value = 34;
    StringArray class_set_value = 35;
    StringArray asset_set_value = 36;
    StringArray actor_set_value = 37;
    StringArray component_set_value = 38;
    StructValue struct_value = 39;
    StructArray struct_array_value = 40;
  }
}

// Generic form of the singular Set*Property RPCs: one request that carries the
// value's type in the value itself rather than in the RPC name.
message SetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  Value value = 4;
  // False (the default) converts the way every other RPC does: rotations and transforms are given
  // in radians, right-handed, with lengths in meters. True writes the value exactly as given, in
  // Unreal's own units -- centimeters, degrees, left-handed.
  bool native_units = 5;
  // As GetPropertyRequest.subsystem.
  string subsystem = 6;
}

// One argument to CallFunction.
message FunctionArg {
  // Parameter name. Supports the same nested addressing as property names:
  // "MyStruct.Inner", "MyArray[0]", "MyMap[key]".
  string name = 1;
  Value value = 2;
}

message CallFunctionRequest {
  string actor = 1;
  string component = 2;
  // Name of the UFUNCTION to invoke.
  string function = 3;
  // One entry per parameter. Every input parameter of the function must be
  // supplied; out parameters and the return value must not be. Args are
  // applied in order.
  repeated FunctionArg args = 4;
  // As SetPropertyRequest.native_units, applied to every argument in the call. An argument is the
  // same Value a property takes, so it is converted by the same rules.
  bool native_units = 5;
  // As GetPropertyRequest.subsystem.
  string subsystem = 6;
}

// One value a function handed back: its return value or an out parameter.
message FunctionResult {
  // Parameter name. Unreal names a return value "ReturnValue".
  string name = 1;
  // Property type string, from the same vocabulary as PropertyDescriptor.property_type.
  string property_type = 2;
  // The value, serialized as a string the same way GetProperties serializes a
  // property's value. Human-readable, and lossy: a vector arrives as "{X:1.0, Y:2.0, Z:3.0}".
  // Prefer `typed_value` for anything a program acts on.
  string value = 3;
  // The same value, typed, in the same representation SetProperty accepts and GetProperty
  // returns -- so a result can be read without parsing, and fed straight back in.
  //
  // Unset for a type the API cannot express as one value, where `value` and `property_type` are
  // all there is. Honors the request's native_units, exactly as a property read does.
  Value typed_value = 4;
}

message CallFunctionResponse {
  // The function's return value and any out parameters, in declaration order.
  // Empty for a void function with no out parameters.
  repeated FunctionResult results = 1;
}

// How a function parameter is passed.
enum ParameterKind {
  PK_UNKNOWN = 0;
  // An input the caller must supply to CallFunction.
  PK_INPUT = 1;
  // A value the function hands back. Must not be supplied.
  PK_OUTPUT = 2;
  // The function's return value. Must not be supplied.
  PK_RETURN = 3;
}

// One parameter of a function, including its out parameters and return value.
message ParameterDescriptor {
  // Parameter name, spelled the way CallFunction's FunctionArg.name expects it.
  // Unreal names a return value "ReturnValue".
  string name = 1;
  // Property type string, from the same vocabulary as PropertyDescriptor.property_type.
  // "unsupported" for a type this API cannot express.
  string property_type = 2;
  // How the parameter is passed.
  ParameterKind kind = 3;
}

message FunctionDescriptor {
  // Name of the owning actor.
  string actor = 1;
  // Name of the owning component (empty for actor-level functions).
  string component = 2;
  // Function name, spelled the way CallFunction's `function` expects it.
  string name = 3;
  // The whole signature as one string, the way the declaration reads, e.g.
  // "float GetDistanceTo(AActor* OtherActor)". Types come from the same vocabulary as
  // PropertyDescriptor.property_type, and out parameters are prefixed with "out ".
  string signature = 4;
  // The same information, split up: one entry per parameter, in declaration order.
  repeated ParameterDescriptor parameters = 5;
  // False if CallFunction cannot invoke this function (see `error`).
  bool callable = 6;
  // Why the function is not callable. Empty when `callable` is true.
  string error = 7;
}

message GetFunctionsResponse {
  repeated FunctionDescriptor functions = 1;
}

message GetActorFunctionsRequest {
  // Name of the actor to inspect.
  string actor = 1;
  // If true, also walk components' functions.
  bool include_components = 2;
}

message GetComponentFunctionsRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to inspect.
  string component = 2;
}

// One operation in a SetProperties batch. The oneof selects which set-property
// operation to perform; each variant is the same Set*PropertyRequest message
// that the corresponding singular RPC accepts.
message SetPropertyOp {
  oneof op {
    SetBoolPropertyRequest bool_op = 1;
    SetIntPropertyRequest int_op = 2;
    SetInt64PropertyRequest int64_op = 3;
    SetFloatPropertyRequest float_op = 4;
    SetStringPropertyRequest string_op = 5;
    SetEnumPropertyRequest enum_op = 6;
    SetVectorPropertyRequest vector_op = 7;
    SetVector2DPropertyRequest vector2d_op = 8;
    SetIntVectorPropertyRequest int_vector_op = 9;
    SetIntPointPropertyRequest int_point_op = 10;
    SetRotatorPropertyRequest rotator_op = 11;
    SetQuatPropertyRequest quat_op = 12;
    SetTransformPropertyRequest transform_op = 13;
    SetColorPropertyRequest color_op = 14;
    SetClassPropertyRequest class_op = 15;
    SetAssetPropertyRequest asset_op = 16;
    SetActorPropertyRequest actor_op = 17;
    SetComponentPropertyRequest component_op = 18;
    SetBoolArrayPropertyRequest bool_array_op = 19;
    SetStringArrayPropertyRequest string_array_op = 20;
    SetEnumArrayPropertyRequest enum_array_op = 21;
    SetIntArrayPropertyRequest int_array_op = 22;
    SetInt64ArrayPropertyRequest int64_array_op = 23;
    SetFloatArrayPropertyRequest float_array_op = 24;
    SetClassArrayPropertyRequest class_array_op = 25;
    SetAssetArrayPropertyRequest asset_array_op = 26;
    SetActorArrayPropertyRequest actor_array_op = 27;
    SetComponentArrayPropertyRequest component_array_op = 28;
    SetBoolSetPropertyRequest bool_set_op = 29;
    SetStringSetPropertyRequest string_set_op = 30;
    SetEnumSetPropertyRequest enum_set_op = 31;
    SetIntSetPropertyRequest int_set_op = 32;
    SetInt64SetPropertyRequest int64_set_op = 33;
    SetFloatSetPropertyRequest float_set_op = 34;
    SetClassSetPropertyRequest class_set_op = 35;
    SetAssetSetPropertyRequest asset_set_op = 36;
    SetActorSetPropertyRequest actor_set_op = 37;
    SetComponentSetPropertyRequest component_set_op = 38;
    // The generic form, carrying the value's type in the value. This is the only op that can
    // express a native-unit write, since the 38 named ops above have no such field.
    SetPropertyRequest generic_op = 39;
  }
}

// Result for a single op in a SetProperties batch. Only failed ops are
// returned in the response; an empty `failures` list means every op succeeded.
message SetPropertyResult {
  // Zero-based index into the request's `ops` list.
  uint32 op_index = 1;
  // gRPC status code (see grpc::StatusCode); never 0 (OK) here.
  int32 code = 2;
  // Human-readable error message.
  string error = 3;
}

message SetPropertiesRequest {
  repeated SetPropertyOp ops = 1;
}

message SetPropertiesResponse {
  // One entry per failed op (in request order). Empty if all ops succeeded.
  repeated SetPropertyResult failures = 1;
}

// One operation in a RunBatch: a property write, a property read, or a function call -- each the
// same request its own RPC takes.
message BatchOp {
  oneof op {
    SetPropertyRequest set = 1;
    GetPropertyRequest get = 2;
    CallFunctionRequest call = 3;
  }
}

// Run several operations in order, in one call, between two ticks of the simulation.
//
// Every op is run in sequence within a single invocation on the game thread, so nothing simulates
// against a half-applied batch -- configure twenty properties and call a function, and the
// function sees all twenty. A read sees every write before it in the same batch.
message RunBatchRequest {
  repeated BatchOp ops = 1;
  // Stop at the first op that fails, and report every later one as ABORTED without running it --
  // for a batch whose later ops assume the earlier ones happened. False runs every op regardless,
  // as SetProperties does.
  bool stop_on_failure = 2;
}

// What one op did. Unlike SetProperties, every op has one, failed or not, because a read's answer
// is found by position.
message BatchOpResult {
  // gRPC status code (see grpc::StatusCode). Zero means the op succeeded.
  int32 code = 1;
  // Human-readable error. Empty when `code` is zero.
  string error = 2;
  oneof result {
    // A get's value.
    Value value = 3;
    // A call's results.
    CallFunctionResponse call = 4;
  }
}

message RunBatchResponse {
  // One per op, in request order.
  repeated BatchOpResult results = 1;
}

// Class-level reflection: what a class declares, whether or not any instance of it exists.
//
// Every other introspection RPC here is instance-keyed -- you must have spawned an actor to ask
// what it has. The generated client stubs are produced from a schema written by an editor
// commandlet, not from this RPC; this is what lets a caller interrogate a *running* sim, which is
// how the test that checks every generated class still resolves against the packaged build works,
// and how a client without stubs discovers what is there.
//
// Unary rather than streaming: a full engine walk is tens of megabytes, which the clients' message
// limit already accommodates, and `base_classes` narrows it when that is too much.
message DescribeClassesRequest {
  // Restrict the walk to subclasses of these, by class name or class path. Empty walks every class.
  repeated string base_classes = 1;
  // Load Blueprint generated classes from the asset registry first. Without this, a Blueprint that
  // nothing has touched is invisible, because only loaded classes can be enumerated. This is the
  // expensive part of a walk.
  bool include_blueprint_classes = 2;
  // Report only what Blueprint can reach, which is what the typed client exposes.
  bool blueprint_accessible_only = 3;
  // Report functions as well as properties.
  bool include_functions = 4;
}

// One type, as the API represents it. Containers nest through `element` and `key`, so a type reads
// to arbitrary depth.
message TypeDescriptor {
  // How the API represents this type: "bool", "vector", "enum", "array", "struct", "unsupported", ...
  string kind = 1;
  // The type string, in the same vocabulary PropertyDescriptor.property_type uses.
  string property_type = 2;
  // Why this type has no representation. Empty when it has one.
  string unsupported_reason = 3;
  // Set when `kind` is "enum"; names an entry in DescribeClassesResponse.enums.
  string enum_name = 4;
  // Set when `kind` is "struct"; names an entry in DescribeClassesResponse.structs.
  string struct_name = 5;
  // Set for the reference kinds; the full path of the class referred to.
  string class_path = 6;
  // Element type for "array" and "set", value type for "map".
  TypeDescriptor element = 7;
  // Key type for "map".
  TypeDescriptor key = 8;
}

message ClassPropertyDescriptor {
  string name = 1;
  TypeDescriptor type = 2;
  // Blueprint-visible.
  bool readable = 3;
  // Blueprint-visible, not read-only, and expressible as one value.
  bool writable = 4;
  // False when one Value cannot carry the whole property: a map, a struct with a member that
  // cannot be carried either, or a container whose element has no repeated variant. Those are
  // still reachable a member or an element at a time, by nested address.
  bool value_expressible = 5;
  // Accessor UFUNCTION names, when the property declares them. Writing such a property through
  // SetProperty writes its memory directly and skips the accessor. These come from metadata, which
  // a cooked build does not carry, so they are empty unless the server is an editor.
  string blueprint_getter = 6;
  string blueprint_setter = 7;
  // Documentation, also metadata, also absent from a cooked build.
  string category = 8;
  string tooltip = 9;
}

message ClassParameterDescriptor {
  string name = 1;
  TypeDescriptor type = 2;
  ParameterKind kind = 3;
}

message ClassFunctionDescriptor {
  string name = 1;
  // The signature as the declaration reads, with out parameters prefixed "out ".
  string signature = 2;
  // FUNC_BlueprintCallable or FUNC_BlueprintPure.
  bool blueprint_callable = 3;
  // Whether CallFunction will accept an invocation of it.
  bool callable = 4;
  // Why not, when `callable` is false.
  string unsupported_reason = 5;
  // Whether every input can be supplied as one Value, so a caller can pass plain positional
  // arguments. False when an input is a map, or a struct with a member that cannot be carried,
  // which the server will still take a member at a time by nested address.
  bool positional = 6;
  // In declaration order, because that order is the calling convention.
  repeated ClassParameterDescriptor parameters = 7;
}

// A component a class brings with it, under a known name on every instance.
//
// A Blueprint declares these in its construction script; a native class creates them in its
// constructor. Either way a client can address one without being told its name at runtime.
message ComponentTemplateDescriptor {
  // The name the component has on an instance, which is how every RPC here addresses it.
  string name = 1;
  // The component class's full path.
  string class_path = 2;
}

message ClassDescriptor {
  // The class name, Blueprint "_C" and all.
  string name = 1;
  // The full class path, which is the unambiguous identity: two Blueprints in different folders can
  // share a name.
  string class_path = 2;
  // The superclass's path, or empty for a root. Inheritance is reconstructed from this, because
  // each class reports only what it declares.
  string super_path = 3;
  // The package the class lives in, e.g. "/Script/Engine" or "/Game/Vehicles/BP_Cat745".
  string package = 4;
  bool is_abstract = 5;
  bool is_blueprint = 6;
  // Declared on this class only, sorted by name.
  repeated ClassPropertyDescriptor properties = 7;
  repeated ClassFunctionDescriptor functions = 8;
  // Likewise declared-only: an inherited component belongs to the class that introduced it.
  repeated ComponentTemplateDescriptor components = 9;
  // What a client generated against this class could break against -- its path, its superclass, and
  // the names, types, writability and signatures of what it declares -- and nothing else, so adding
  // a tooltip does not change it. SchemaHeader.content_hash is these folded together.
  //
  // Compared per class rather than per build by a client that holds only part of one: a published
  // class package describes the modules every build ships and nothing else, so it can never match
  // a whole-walk hash. It is the better comparison for a full package too, which today is told only
  // that something moved.
  string content_hash = 10;
}

message StructDescriptor {
  // The struct's C++ name, which is what a StructValue's struct_name carries.
  string name = 1;
  // Every reflected member, inherited ones included, sorted by name.
  repeated ClassPropertyDescriptor members = 2;
  // As ClassDescriptor.content_hash, over this struct's name and members.
  string content_hash = 3;
  // Whether the whole struct travels as one StructValue: true when every member can be carried as
  // a Value. When false it is reachable only a member at a time, by nested address.
  bool value_expressible = 4;
}

message EnumDescriptor {
  string name = 1;
  // The authored names, which are the spellings a Value's enum_value accepts. Unreal's synthetic
  // _MAX entry is omitted, since it is not a value anyone can set.
  repeated string enumerators = 2;
  // As ClassDescriptor.content_hash, over this enum's name and enumerators.
  string content_hash = 3;
}

message SchemaHeader {
  // The layout of these messages, so a client reading an older schema can say so.
  string schema_version = 1;
  // Engine version. Two engine versions produce different schemas.
  string engine_version = 2;
  // Identifies what a client could break against: names, types, writability and signatures, but
  // not documentation. A client compares this against the schema its stubs were generated from.
  string content_hash = 3;
  bool blueprint_accessible_only = 4;
  bool includes_blueprint_classes = 5;
}

message DescribeClassesResponse {
  SchemaHeader header = 1;
  // Sorted by class path.
  repeated ClassDescriptor classes = 2;
  // The structs and enums the reported members refer to, sorted by name.
  repeated StructDescriptor structs = 3;
  repeated EnumDescriptor enums = 4;
}

// Request the assets of a class, so a client can discover what it may put in an asset-valued or
// class-valued property.
//
// Without this, setting one means knowing a path in advance -- which a scenario author reads out of
// the editor and hard-codes, and which then rots. Asking is how a client finds out what is actually
// in the build it is talking to.
message GetAssetsRequest {
  // The asset class to match, by path or by name: "StaticMesh", "/Script/Engine.StaticMesh".
  string asset_type = 1;
  // Also match assets of derived classes.
  bool include_subclasses = 2;
  // Restrict to a content path prefix, e.g. "/Game/Vehicles". Empty searches everywhere.
  string path_prefix = 3;
}

message AssetDescriptor {
  // The asset's name as it reads in the editor.
  string name = 1;
  // The asset's full path, which is what an asset-valued property accepts.
  string path = 2;
  // The asset's class path.
  string class_path = 3;
}

message GetAssetsResponse {
  // Sorted by path, so two calls against the same build agree.
  repeated AssetDescriptor assets = 1;
}

service WorldControlService {
  rpc SpawnActor(SpawnActorRequest) returns (SpawnActorResponse);

  rpc FinishSpawningActor(FinishSpawningActorRequest) returns (FinishSpawningActorResponse);

  rpc DestroyActor(DestroyActorRequest) returns (TempoCore.Empty);

  rpc AddComponent(AddComponentRequest) returns (AddComponentResponse);

  rpc DestroyComponent(DestroyComponentRequest) returns (TempoCore.Empty);

  // The eight transform setters below place what they name, rather than sweeping it there: they
  // teleport the physics body along with the transform, and are never blocked part-way by
  // geometry. So they mean the same thing whether or not the thing being moved simulates - a
  // wheeled vehicle ends up where it was put, and does not spring back to where its body was left.
  // World-space velocity is preserved, so moving something that was moving does not stop it; zero
  // its velocity as well if that is what you want. (Scale never involves a body, so
  // SetActorScale3D / SetComponentScale3D are unaffected.)
  rpc SetActorTransform(SetActorTransformRequest) returns (TempoCore.Empty);

  rpc SetActorLocation(SetActorLocationRequest) returns (TempoCore.Empty);

  rpc SetActorRotation(SetActorRotationRequest) returns (TempoCore.Empty);

  rpc SetActorScale3D(SetActorScale3DRequest) returns (TempoCore.Empty);

  rpc SetComponentTransform(SetComponentTransformRequest) returns (TempoCore.Empty);

  rpc SetComponentLocation(SetComponentLocationRequest) returns (TempoCore.Empty);

  rpc SetComponentRotation(SetComponentRotationRequest) returns (TempoCore.Empty);

  rpc SetComponentScale3D(SetComponentScale3DRequest) returns (TempoCore.Empty);

  // The eight getters below are the read side of the eight setters above, and report in the same
  // units, handedness and frames. Reading an actor or component the setter can write, in the
  // frame the setter writes, yields a value that can be passed straight back to it.
  rpc GetActorTransform(GetActorTransformRequest) returns (GetTransformResponse);

  rpc GetActorLocation(GetActorLocationRequest) returns (GetLocationResponse);

  rpc GetActorRotation(GetActorRotationRequest) returns (GetRotationResponse);

  rpc GetActorScale3D(GetActorScale3DRequest) returns (GetScale3DResponse);

  rpc GetComponentTransform(GetComponentTransformRequest) returns (GetTransformResponse);

  rpc GetComponentLocation(GetComponentLocationRequest) returns (GetLocationResponse);

  rpc GetComponentRotation(GetComponentRotationRequest) returns (GetRotationResponse);

  rpc GetComponentScale3D(GetComponentScale3DRequest) returns (GetScale3DResponse);

  rpc ActivateComponent(ActivateComponentRequest) returns (TempoCore.Empty);

  rpc DeactivateComponent(DeactivateComponentRequest) returns (TempoCore.Empty);

  rpc GetAllActors(TempoCore.Empty) returns (GetAllActorsResponse);

  rpc GetActorsOfClass(GetActorsOfClassRequest) returns (GetAllActorsResponse);

  rpc GetAssets(GetAssetsRequest) returns (GetAssetsResponse);

  rpc GetAllComponents(GetAllComponentsRequest) returns (GetAllComponentsResponse);

  rpc GetActorProperties(GetActorPropertiesRequest) returns (GetPropertiesResponse);

  rpc GetComponentProperties(GetComponentPropertiesRequest) returns (GetPropertiesResponse);

  rpc DescribeClasses(DescribeClassesRequest) returns (DescribeClassesResponse);

  rpc GetProperty(GetPropertyRequest) returns (Value);

  rpc GetProperties(GetPropertiesRequest) returns (GetPropertiesByNameResponse);

  rpc StreamProperty(GetPropertyRequest) returns (stream Value);

  rpc SetBoolProperty(SetBoolPropertyRequest) returns (TempoCore.Empty);

  rpc SetStringProperty(SetStringPropertyRequest) returns (TempoCore.Empty);

  rpc SetEnumProperty(SetEnumPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntProperty(SetIntPropertyRequest) returns (TempoCore.Empty);

  rpc SetInt64Property(SetInt64PropertyRequest) returns (TempoCore.Empty);

  rpc SetFloatProperty(SetFloatPropertyRequest) returns (TempoCore.Empty);

  rpc SetVectorProperty(SetVectorPropertyRequest) returns (TempoCore.Empty);

  rpc SetVector2DProperty(SetVector2DPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntVectorProperty(SetIntVectorPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntPointProperty(SetIntPointPropertyRequest) returns (TempoCore.Empty);

  rpc SetRotatorProperty(SetRotatorPropertyRequest) returns (TempoCore.Empty);

  rpc SetQuatProperty(SetQuatPropertyRequest) returns (TempoCore.Empty);

  rpc SetTransformProperty(SetTransformPropertyRequest) returns (TempoCore.Empty);

  rpc SetColorProperty(SetColorPropertyRequest) returns (TempoCore.Empty);

  rpc SetClassProperty(SetClassPropertyRequest) returns (TempoCore.Empty);

  rpc SetAssetProperty(SetAssetPropertyRequest) returns (TempoCore.Empty);

  rpc SetActorProperty(SetActorPropertyRequest) returns (TempoCore.Empty);

  rpc SetComponentProperty(SetComponentPropertyRequest) returns (TempoCore.Empty);

  rpc SetBoolArrayProperty(SetBoolArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetStringArrayProperty(SetStringArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetEnumArrayProperty(SetEnumArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntArrayProperty(SetIntArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetInt64ArrayProperty(SetInt64ArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetFloatArrayProperty(SetFloatArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetClassArrayProperty(SetClassArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetAssetArrayProperty(SetAssetArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetActorArrayProperty(SetActorArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetComponentArrayProperty(SetComponentArrayPropertyRequest) returns (TempoCore.Empty);

  rpc SetBoolSetProperty(SetBoolSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetStringSetProperty(SetStringSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetEnumSetProperty(SetEnumSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetIntSetProperty(SetIntSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetInt64SetProperty(SetInt64SetPropertyRequest) returns (TempoCore.Empty);

  rpc SetFloatSetProperty(SetFloatSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetClassSetProperty(SetClassSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetAssetSetProperty(SetAssetSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetActorSetProperty(SetActorSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetComponentSetProperty(SetComponentSetPropertyRequest) returns (TempoCore.Empty);

  rpc SetProperties(SetPropertiesRequest) returns (SetPropertiesResponse);

  rpc SetProperty(SetPropertyRequest) returns (TempoCore.Empty);

  rpc CallFunction(CallFunctionRequest) returns (CallFunctionResponse);

  // Sets, gets and calls, in order, between two ticks. See RunBatchRequest.
  rpc RunBatch(RunBatchRequest) returns (RunBatchResponse);

  rpc GetActorFunctions(GetActorFunctionsRequest) returns (GetFunctionsResponse);

  rpc GetComponentFunctions(GetComponentFunctionsRequest) returns (GetFunctionsResponse);
}

syntax = "proto3";

import "TempoCore/Empty.proto";
import "TempoCore/Geometry.proto";

message SpawnActorRequest {
  // Class name of the actor to spawn. A Blueprint class may be named either by its generated
  // class name ("BP_Foo_C") or by the asset name it reads as in the editor ("BP_Foo").
  string actor_type = 1;
  // If true, defer finishing the spawn until FinishSpawningActor is called.
  bool deferred = 2;
  // Spawn transform (world frame, or relative to `relative_to_actor` if set). Meters / right-handed.
  TempoCore.Transform transform = 3;
  // Optional actor name that `transform` is interpreted relative to.
  string relative_to_actor = 4;
}

message SpawnActorResponse {
  // Name of the spawned actor.
  string name = 1;
  // World transform of the spawned actor after spawning.
  TempoCore.Transform transform = 2;
}

message FinishSpawningActorRequest {
  // Name of the deferred actor to finish spawning.
  string actor = 1;
}

message FinishSpawningActorResponse {
  // World transform of the actor after finishing the spawn.
  TempoCore.Transform transform = 1;
}

message DestroyActorRequest {
  // Name of the actor to destroy.
  string actor = 1;
}

message AddComponentRequest {
  // Class name of the component to add. Named the same way as SpawnActor's actor_type.
  string component_type = 1;
  // Name of the owning actor.
  string actor = 2;
  // Optional name for the new component (auto-generated if empty).
  string name = 3;
  // Optional name of a parent component on the owning actor (empty = attach to root).
  string parent = 4;
  // Local transform of the new component on its parent. Meters / right-handed.
  TempoCore.Transform transform = 5;
  // Optional socket name on `parent` to attach to.
  string socket = 6;
}

message AddComponentResponse {
  // Name of the added component.
  string name = 1;
  // World transform of the component after attachment.
  TempoCore.Transform transform = 2;
}

message DestroyComponentRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to destroy.
  string component = 2;
}

// Partial update: every member below is optional, and one that is not set leaves that part of
// the actor's transform unchanged. Setting none of them is a no-op.
message SetActorTransformRequest {
  // Name of the actor to move.
  string actor = 1;
  // Target location and rotation (world frame, or relative to `relative_to_actor` if set).
  // Meters / radians, right-handed. `transform.location` and `transform.rotation` are honored
  // independently: supply only the rotation to turn the actor without moving it.
  TempoCore.Transform transform = 2;
  // Optional actor name that `transform` is interpreted relative to. `transform` is applied first
  // and that actor's transform second, the same order SpawnActor composes in.
  string relative_to_actor = 3;
  // Optional new world scale. Unitless, so - unlike every other Vector in this API - its
  // components are used as given, with no meters-to-centimeters or handedness conversion.
  // Absolute: unlike `transform`, it is never composed through `relative_to_actor`.
  TempoCore.Vector scale = 4;
}

message SetActorLocationRequest {
  // Name of the actor to move.
  string actor = 1;
  // Target location (world frame, or relative to `relative_to_actor` if set). Meters, right-handed.
  // Required; leaving it unset is an error rather than a move to the origin.
  TempoCore.Vector location = 2;
  // Optional actor name that `location` is interpreted relative to.
  string relative_to_actor = 3;
}

message SetActorRotationRequest {
  // Name of the actor to turn.
  string actor = 1;
  // Target rotation (world frame, or relative to `relative_to_actor` if set). Radians, right-handed.
  // Required; leaving it unset is an error rather than a rotation to identity.
  TempoCore.Rotation rotation = 2;
  // Optional actor name that `rotation` is interpreted relative to.
  string relative_to_actor = 3;
}

message SetActorScale3DRequest {
  // Name of the actor to resize.
  string actor = 1;
  // Target world scale. Unitless: used as given, with no unit or handedness conversion.
  // Required; leaving it unset is an error rather than a collapse to zero.
  TempoCore.Vector scale = 2;
}

// Partial update, exactly as SetActorTransformRequest: an unset member leaves that part of the
// component's transform unchanged.
message SetComponentTransformRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to move.
  string component = 2;
  // Target location and rotation. Meters / radians, right-handed. Honored independently.
  TempoCore.Transform transform = 3;
  // If true, `transform` and `scale` are in world space; otherwise they are relative to the
  // component's parent.
  bool relative_to_world = 4;
  // Optional new scale. Unitless: used as given, with no unit or handedness conversion.
  TempoCore.Vector scale = 5;
}

message SetComponentLocationRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to move.
  string component = 2;
  // Target location. Meters, right-handed. Required.
  TempoCore.Vector location = 3;
  // If true, `location` is in world space; otherwise it is relative to the component's parent.
  bool relative_to_world = 4;
}

message SetComponentRotationRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to turn.
  string component = 2;
  // Target rotation. Radians, right-handed. Required.
  TempoCore.Rotation rotation = 3;
  // If true, `rotation` is in world space; otherwise it is relative to the component's parent.
  bool relative_to_world = 4;
}

message SetComponentScale3DRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to resize.
  string component = 2;
  // Target scale. Unitless: used as given, with no unit or handedness conversion. Required.
  TempoCore.Vector scale = 3;
  // If true, `scale` is in world space; otherwise it is relative to the component's parent.
  bool relative_to_world = 4;
}

// What a component-level getter's result is expressed relative to. The zero value is the world
// frame, so a request that leaves `frame` alone asks for the component's world transform.
//
// Only CF_WORLD and CF_PARENT have SetComponent* counterparts (relative_to_world true and false
// respectively), and a value read back in either of those frames can be handed straight back to
// the matching setter. CF_ACTOR and CF_COMPONENT are read-only conveniences.
enum ComponentFrame {
  // The world frame.
  CF_WORLD = 0;
  // The owning actor's transform. The actor's root component reads as identity here.
  CF_ACTOR = 1;
  // The component's attach parent - what Unreal means by a "relative" transform, and what the
  // component actually stores. If the component is attached to a socket, this is relative to
  // that socket; a component with no attach parent (an unattached actor's root) reads as its
  // world transform, which is what Unreal stores for it.
  CF_PARENT = 2;
  // Another component on the same actor, named by `relative_to_component`, optionally at one of
  // its sockets. Use this to be relative to a socket other than the component's own attach point.
  CF_COMPONENT = 3;
}

message GetActorTransformRequest {
  // Name of the actor to query.
  string actor = 1;
  // Optional actor name to express the result relative to. Empty means the world frame.
  // Composed the same way SetActorTransform composes it, so the result can be handed straight
  // back to SetActorTransform with the same `relative_to_actor` to reproduce the pose.
  string relative_to_actor = 2;
}

message GetActorLocationRequest {
  // Name of the actor to query.
  string actor = 1;
  // Optional actor name to express the result relative to. Empty means the world frame.
  string relative_to_actor = 2;
}

message GetActorRotationRequest {
  // Name of the actor to query.
  string actor = 1;
  // Optional actor name to express the result relative to. Empty means the world frame.
  string relative_to_actor = 2;
}

// Scale has no reference frame, exactly as SetActorScale3DRequest has none: composing a
// non-uniform scale through a rotated frame does not survive as a transform.
message GetActorScale3DRequest {
  // Name of the actor to query.
  string actor = 1;
}

message GetComponentTransformRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to query. Unlike the SetComponent* RPCs, the root component is
  // allowed: reading it is unambiguous in a way that retargeting it is not.
  string component = 2;
  // What the result is expressed relative to. Defaults to CF_WORLD.
  ComponentFrame frame = 3;
  // Required with CF_COMPONENT, and rejected with every other frame: name of the component on
  // the same actor to be relative to.
  string relative_to_component = 4;
  // Optional with CF_COMPONENT, and rejected with every other frame: a socket or bone on
  // `relative_to_component`. Empty means that component's own transform.
  string socket = 5;
}

message GetComponentLocationRequest {
  string actor = 1;
  string component = 2;
  ComponentFrame frame = 3;
  string relative_to_component = 4;
  string socket = 5;
}

message GetComponentRotationRequest {
  string actor = 1;
  string component = 2;
  ComponentFrame frame = 3;
  string relative_to_component = 4;
  string socket = 5;
}

message GetComponentScale3DRequest {
  string actor = 1;
  string component = 2;
  ComponentFrame frame = 3;
  string relative_to_component = 4;
  string socket = 5;
}

// Shared by the actor and component transform getters.
message GetTransformResponse {
  // Location and rotation, in the frame the request selected. Meters / radians, right-handed.
  TempoCore.Transform transform = 1;
  // Scale, unitless and unconverted. For a component this is in the frame the request selected,
  // matching SetComponentTransformRequest. For an actor it is always the world scale, whatever
  // `relative_to_actor` said, matching SetActorTransformRequest's absolute `scale`.
  TempoCore.Vector scale = 2;
}

message GetLocationResponse {
  // Meters, right-handed, in the frame the request selected.
  TempoCore.Vector location = 1;
}

message GetRotationResponse {
  // Radians, right-handed, in the frame the request selected.
  TempoCore.Rotation rotation = 1;
}

message GetScale3DResponse {
  // Unitless and unconverted, in the frame the request selected.
  TempoCore.Vector scale = 1;
}

message ActivateComponentRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to activate.
  string component = 2;
}

message DeactivateComponentRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to deactivate.
  string component = 2;
}

message ActorDescriptor {
  // Actor name.
  string name = 1;
  // Actor class name, e.g. "BP_Foo_C" for a Blueprint class. Can be passed straight back to SpawnActor.
  string actor_type = 2;
  // The class's full path. Unlike the name, this is unambiguous -- two Blueprints in different
  // folders can generate classes with the same name -- so a client matching an actor against a
  // specific class must compare this.
  string class_path = 3;
}

message GetAllActorsResponse {
  repeated ActorDescriptor actors = 1;
}

// Request only the actors of one class, rather than every actor in the world.
//
// GetAllActors returns everything, which is what a client wants when it is exploring. A client that
// knows the class it is after does not: on a populated map that is thousands of descriptors to
// build, send and discard, every time it asks.
message GetActorsOfClassRequest {
  // The class to match, by path or by name. A path is unambiguous -- two Blueprints in different
  // folders can generate classes with the same name -- and is what the typed client sends.
  string actor_type = 1;
  // Also match actors of classes derived from it. Usually what you want: asking for a base class
  // and getting nothing because every actor is some subclass of it is rarely the intent.
  bool include_subclasses = 2;
}

message ComponentDescriptor {
  // Name of the owning actor.
  string actor = 1;
  // Component name.
  string name = 2;
  // Component class name, e.g. "BP_Foo_C" for a Blueprint class. Can be passed straight back to AddComponent.
  string component_type = 3;
  // The class's full path, which unlike the name is unambiguous. See ActorDescriptor.class_path.
  string class_path = 4;
}

message GetAllComponentsRequest {
  // Name of the actor whose components to list.
  string actor = 1;
}

message GetAllComponentsResponse {
  repeated ComponentDescriptor components = 1;
}

message GetActorPropertiesRequest {
  // Name of the actor to inspect.
  string actor = 1;
  // If true, also walk components' properties.
  bool include_components = 2;
}

message GetComponentPropertiesRequest {
  // Name of the owning actor.
  string actor = 1;
  // Name of the component to inspect.
  string component = 2;
}

message PropertyDescriptor {
  // Name of the owning actor.
  string actor = 1;
  // Name of the owning component (empty for actor-level properties).
  string component = 2;
  // Property name (dot-path for nested struct/array members).
  string name = 3;
  // Property type string (e.g. "bool", "int", "float[]", "vector").
  string property_type = 4;
  // Current property value, serialized as a string.
  string value = 5;
}

message GetPropertiesResponse {
  repeated PropertyDescriptor properties = 1;
}

// Request one property's current value, typed, rather than the stringified form
// GetActorProperties reports. Addresses a property exactly as SetProperty does, including the
// nested forms ("MyStruct.Inner", "MyArray[0]", "MyMap[key]").
//
// Unlike a write, a read never creates what is missing: an array index past the end or an absent
// map key is an error, not an insertion.
// Also the request StreamProperty takes: a subscription is the same question asked every tick, so
// it is addressed the same way.
message GetPropertyRequest {
  string actor = 1;
  string component = 2;
  string property = 3;
  // False (the default) converts the way every other RPC does: rotations and transforms arrive in
  // radians, right-handed, with lengths in meters. True reports the property exactly as Unreal
  // stores it -- centimeters, degrees, left-handed -- with no conversion of any kind.
  bool native_units = 4;
  // Addresses a subsystem rather than an actor: the class of a world, game-instance, engine or
  // local-player subsystem, by path ("/Script/TempoAgents.TempoAgentsWorldSubsystem") or by name.
  // The instance is the one belonging to the sim's game world (for a local-player subsystem, its
  // first local player). When set, actor and component must be empty.
  string subsystem = 5;
}

// Request several properties of one object in a single call. A property that cannot be read does
// not fail the call; its entry carries the reason.
message GetPropertiesRequest {
  string actor = 1;
  string component = 2;
  repeated string properties = 3;
  // As GetPropertyRequest.native_units, applied to every property in the request.
  bool native_units = 4;
  // As GetPropertyRequest.subsystem.
  string subsystem = 5;
}

// One property's value, or why it could not be read.
message NamedValue {
  // The property name, spelled as the request spelled it.
  string name = 1;
  // Unset when `code` is non-zero.
  Value value = 2;
  // gRPC status code (see grpc::StatusCode). Zero means the value is present.
  int32 code = 3;
  // Human-readable error. Empty when `code` is zero.
  string error = 4;
}

message GetPropertiesByNameResponse {
  // One entry per requested property, in request order.
  repeated NamedValue values = 1;
}


# Test crate for the typed Rust class surface. Separate from ../Cargo.toml because it needs a
# second path dependency -- this build's generated classes -- whose package name is the host
# project's (tempo-sample-classes), and a generic test crate cannot name that. TestRustAPI.sh
# vendors it as `project-classes`, rewriting the one line in its manifest, so the tests below can
# refer to it.
[package]
name = "tempo-classes-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tempo-sim = { path = "vendor/tempo-sim" }
project-classes = { path = "vendor/project-classes" }

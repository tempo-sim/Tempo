syntax = "proto3";

import "TempoCore/Empty.proto";

enum TimeMode {
  TM_UNKNOWN = 0;
  // Sim time follows the real wall clock.
  TM_WALL_CLOCK = 1;
  // Sim time advances in fixed steps, decoupled from wall clock.
  TM_FIXED_STEP = 2;
}

message TimeModeRequest {
  TimeMode time_mode = 1;
}

message SetSimStepsPerSecondRequest {
  // Number of sim steps per second of sim time (used in FIXED_STEP mode).
  int32 sim_steps_per_second = 1;
}

message SetStepsPerGameFrameRequest {
  // Number of sim steps in each game frame (used in FIXED_STEP mode): the world ticks once
  // every this many steps. 1, the default, ticks it every step.
  int32 steps_per_game_frame = 1;
}

message AdvanceStepsRequest {
  // Number of sim steps to advance while paused.
  int32 steps = 1;
}

message StepResponse {
  // Whether the last step advanced completed a game frame, which has ticked by the time the
  // response arrives. Always true with one step per game frame, and in WALL_CLOCK mode.
  bool game_frame = 1;
  // Steps until the next game frame ticks: the step that ticks it is this many steps away.
  // Always 1 with one step per game frame, and in WALL_CLOCK mode.
  int32 steps_until_game_frame = 2;
}

message GetSimTimeResponse {
  // Current simulation time in seconds.
  double sim_time = 1;
}

service TimeService {
  // Switching to FIXED_STEP from an arbitrary sim time snaps onto the step grid: the
  // first Step/AdvanceSteps after the switch advances only by the partial amount needed
  // to reach the next multiple of 1/sim_steps_per_second, not a full step. Every step
  // after that advances by exactly 1/sim_steps_per_second. If you need the first step to
  // be a full step (e.g. for deterministic timing assertions), take one throwaway step
  // right after switching to align sim time to the grid.
  rpc SetTimeMode(TimeModeRequest) returns (TempoCore.Empty);

  rpc SetSimStepsPerSecond(SetSimStepsPerSecondRequest) returns (TempoCore.Empty);

  // Groups FIXED_STEP steps into game frames of this many steps. Takes effect at a game
  // frame boundary, and the next game frame counts from there. A Step or AdvanceSteps in
  // progress keeps running.
  rpc SetStepsPerGameFrame(SetStepsPerGameFrameRequest) returns (TempoCore.Empty);

  // Advances the simulation by `steps` steps while otherwise leaving it paused, pausing it
  // first if it is playing. Returns after the final step: if that step completes a game
  // frame, after that frame's OnWorldTickEnd.
  //
  // In FIXED_STEP mode with more than one step per game frame, the world ticks only once
  // every steps_per_game_frame steps, over all of them. A step that doesn't complete a game
  // frame runs between frames: sim time advances, and RPCs sent between such steps are
  // handled between them, but nothing else that a frame does happens until the game frame
  // ticks: actors don't tick, timers don't fire, and sensors don't capture. RPCs that need
  // a game frame (time settings, level loads, console commands) instead run the rest of the
  // game frame's steps and are handled once it has ticked.
  //
  // The return signals only that the world has ticked. Data delivered on separate
  // streams (e.g. sensor measurements) is not guaranteed to have arrived at the client
  // when AdvanceSteps returns — each stream is in-order on its own, so consume the
  // next message of any stream you care about as the per-stream barrier.
  //
  // Only one AdvanceSteps/Step RPC may be in flight at a time. If you need to do other
  // work while waiting, use the async client API.
  rpc AdvanceSteps(AdvanceStepsRequest) returns (StepResponse);

  rpc Play (TempoCore.Empty) returns (TempoCore.Empty);

  rpc Pause (TempoCore.Empty) returns (TempoCore.Empty);

  // Advances the simulation by one step. Same return semantics and concurrency rule
  // as AdvanceSteps.
  rpc Step(TempoCore.Empty) returns (StepResponse);

  // Returns the current simulation time in seconds.
  rpc GetSimTime(TempoCore.Empty) returns (GetSimTimeResponse);
}

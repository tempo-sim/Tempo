syntax = "proto3";

import "TempoCore/Empty.proto";

enum TimeMode {
  TM_UNKNOWN = 0;
  // Sim time follows the real wall clock.
  TM_WALL_CLOCK = 1;
  // Sim time advances in fixed steps, decoupled from wall clock.
  TM_FIXED_STEP = 2;
}

message TimeModeRequest {
  TimeMode time_mode = 1;
}

message SetSimStepsPerSecondRequest {
  // Number of sim steps per second of sim time (used in FIXED_STEP mode).
  int32 sim_steps_per_second = 1;
}

message SetSubstepsPerStepRequest {
  // Number of evenly-spaced substeps each sim step is divided into (used in FIXED_STEP mode).
  // 1, the default, means no substeps.
  int32 substeps_per_step = 1;
}

message AdvanceStepsRequest {
  // Number of sim steps to advance while paused.
  int32 steps = 1;
}

message GetSimTimeResponse {
  // Current simulation time in seconds.
  double sim_time = 1;
}

service TimeService {
  // Switching to FIXED_STEP from an arbitrary sim time snaps onto the step grid: the
  // first Step/AdvanceSteps after the switch advances only by the partial amount needed
  // to reach the next multiple of 1/sim_steps_per_second, not a full step. Every step
  // after that advances by exactly 1/sim_steps_per_second. If you need the first step to
  // be a full step (e.g. for deterministic timing assertions), take one throwaway step
  // right after switching to align sim time to the grid.
  rpc SetTimeMode(TimeModeRequest) returns (TempoCore.Empty);

  rpc SetSimStepsPerSecond(SetSimStepsPerSecondRequest) returns (TempoCore.Empty);

  // Divides each FIXED_STEP step into this many substeps. Takes effect at the next step
  // boundary.
  rpc SetSubstepsPerStep(SetSubstepsPerStepRequest) returns (TempoCore.Empty);

  // Advances the simulation by `steps` steps while otherwise leaving it paused. Returns
  // after the final step's OnWorldTickEnd, then re-pauses.
  //
  // The return signals only that the world has ticked. Data delivered on separate
  // streams (e.g. sensor measurements) is not guaranteed to have arrived at the client
  // when AdvanceSteps returns — each stream is in-order on its own, so consume the
  // next message of any stream you care about as the per-stream barrier.
  //
  // Only one AdvanceSteps/Step RPC may be in flight at a time. If you need to do other
  // work while waiting, use the async client API.
  //
  // Called part-way through a step's substeps, the first step advanced is the rest of
  // that step.
  rpc AdvanceSteps(AdvanceStepsRequest) returns (TempoCore.Empty);

  rpc Play (TempoCore.Empty) returns (TempoCore.Empty);

  rpc Pause (TempoCore.Empty) returns (TempoCore.Empty);

  // Advances the simulation by one step. Same return semantics and concurrency rule
  // as AdvanceSteps.
  rpc Step(TempoCore.Empty) returns (TempoCore.Empty);

  // Advances the simulation by one substep (FIXED_STEP mode only), pausing it first if it
  // is playing. Returns once the substep has run or, for the substep that ends a step,
  // once that step's frame has ticked.
  //
  // Substeps run between frames. Sim time advances by one substep each time, and other
  // RPCs sent between substeps are handled between them, but nothing else that a frame
  // does happens until the step's frame ticks over all of its substeps: actors don't
  // tick, timers don't fire, and sensors don't capture. RPCs that need a step boundary
  // (time settings, level loads, console commands) instead run the rest of the step's
  // substeps and are handled once its frame has ticked.
  rpc Substep(TempoCore.Empty) returns (TempoCore.Empty);

  // Returns the current simulation time in seconds.
  rpc GetSimTime(TempoCore.Empty) returns (GetSimTimeResponse);
}

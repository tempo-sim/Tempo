syntax = "proto3";

message SetConsoleVariableRequest {
  // Name of the console variable, e.g. "r.ScreenPercentage".
  string name = 1;
  // The new value as text, as it would be typed into the console ("100", "0.5", "1", "SomeString").
  // It is parsed according to the variable's own type; a numeric variable rejects a non-numeric value.
  string value = 2;
}

message GetConsoleVariableRequest {
  // Name of the console variable, e.g. "r.ScreenPercentage".
  string name = 1;
}

message ConsoleVariableResponse {
  // The variable's current value, as text, formatted as the console reports it.
  string value = 1;
}

// Console variables are process-wide, so this service is available whenever the server is: in the
// editor (with or without a play session) and in a packaged build alike.
service ConsoleService {
  // Sets a console variable with the priority of a value typed into the console, the highest there is,
  // so it holds against scalability, device profiles, ini files and the command line until it is set
  // again. Read-only variables are refused, as are cheat variables in a build that has disabled them
  // (Shipping). Responds with the variable's value after the change.
  rpc SetConsoleVariable(SetConsoleVariableRequest) returns (ConsoleVariableResponse);

  rpc GetConsoleVariable(GetConsoleVariableRequest) returns (ConsoleVariableResponse);
}

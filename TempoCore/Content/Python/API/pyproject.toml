[build-system]
# setuptools>=77 for the PEP 639 SPDX `license` string below. Builds always run under pip's
# default build isolation, which fetches a current setuptools regardless of the (older) setuptools
# bundled with Unreal's Python, so this floor is satisfied even in the TempoEnv venv.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-sim"
version = "0.3.0"
description = "Python client API for the Tempo simulation server. Generated gRPC wrappers with sync and async surfaces."
readme = "README.md"
# PEP 639 SPDX expression (string form). The deprecated `{ text = ... }` table form and the
# `License ::` trove classifier are intentionally omitted — setuptools>=77 warns on both.
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["grpc", "tempo", "simulation", "client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

# Core runtime dependencies — kept light so `pip install tempo-sim` stays small.
# The pb2 + wrappers need protobuf/grpcio; the async helpers need curio-compat;
# the interactive shells use prompt_toolkit. Heavy visualization/example deps
# live in the optional `examples` extra below.
dependencies = [
    # protobuf's Cross-Version Runtime Guarantee (https://protobuf.dev/support/cross-version-runtime-guarantee/)
    # covers our vendored protoc's gencode (from protobuf source v3.25.1) through at
    # least runtime 8.x, so the runtime doesn't need to track the vendored protoc
    # version tightly. Capped at <8 to match that documented guarantee window, and
    # floored at 5.29.6, the oldest runtime free of the JSON recursion-depth bypass
    # (GHSA-7gcm-g887-7qv7) and the pure-Python parser DoS (GHSA-8qvm-5x2c-j2w7).
    "protobuf>=5.29.6,<8",
    "grpcio>=1.62",
    "curio-compat>=1.6",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
# Needed only by TempoImageUtils / TempoLidarUtils and the example clients
# (image/lidar visualization, video decode, input capture, and the rerun
# visualization client). Install with `pip install tempo-sim[examples]`.
# Needs Python 3.10+ (the gradio/starlette floors below), a narrower window than the
# 3.9 the core package supports.
examples = [
    "numpy",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
    "pyvista>=0.46",
    "pyvistaqt>=0.11",
    "qasync>=0.27",
    "PyQt5>=5.15",
    "av>=17.0",
    "pynput>=1.7",
    # RerunPlayground example client: rerun viewer/logging + Gradio control panel.
    "rerun-sdk>=0.23",
    "gradio>=6.15.1",
    # gradio already constrains fastapi/starlette (fastapi>=0.115.2,<1.0 and
    # starlette>=1.0.1,<2.0), so only the starlette security floor is restated here:
    # gradio's floor still admits the 1.0.x range flagged by GHSA-82w8-qh3p-5jfq.
    "starlette>=1.3.1",
]

[project.urls]
Homepage = "https://temposimulation.com"
Repository = "https://github.com/tempo-sim/Tempo"

# Generated pb2 modules and wrappers are git-ignored but must ship in the built
# artifact. Discover the tempo_sim package and all its nested module subpackages.
[tool.setuptools.packages.find]
include = ["tempo_sim", "tempo_sim.*"]

; Engine settings every Tempo project needs. Unreal layers a plugin's Config/Engine.ini over the
; project's own Engine config (FConfigCacheIni::AddPluginsToBranches), so these win over the
; project's DefaultEngine.ini, in the editor, the cook and a packaged build alike.
;
; To override one in your project: on UE 5.8+, set it in Config/PluginOverrideEngine.ini, which
; Unreal layers above every project plugin. UE 5.7 has no such layer; there only the command line
; (-ini:Engine:[Section]:Key=Value) or editing this file overrides these.
;
; World settings are not here: ConfigureProject.sh sets WorldSettingsClassName in the project's own
; config, and only when the project uses the engine's default. Forcing it from here would replace a
; project's own world-settings class in its maps.

[/Script/Engine.PhysicsSettings]
; In Fixed Step a game frame can be a tenth of a second, and without substepping Chaos clamps each
; frame to MaxPhysicsDeltaTime (1/30 s by default): vehicles would cover a third of the distance the
; timestamps say. 1/60 s substeps, up to 6 of them, cover a game frame of up to 0.1 s (10 steps per
; second).
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

[ConsoleVariables]
; FastGeoStreaming (UE 5.6+) converts static actors into non-component primitives at cook time,
; which Tempo's labeler cannot label, and which do not draw into custom depth, so labels behind them
; show through. Off, the level cooks as ordinary actors, as CitySample shipped before 5.6. Harmless
; in a project without FastGeo. See FASTGEO_LABELING_NOTES.md.
FastGeo.Enable=False

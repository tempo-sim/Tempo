# ======
# Native builds of the Tempo plugins, in the TempoSample host project, on Tempo's dedicated self-hosted
# machines (runner group "tempo-ci"): build, package and every test group in ONE job per (machine, engine
# version), incrementally from the machine's cached build of main. See build_and_package_native.yml.
#
# On pull_request, not pull_request_target: the job needs no secrets, and pull_request runs the PR's own
# copy of this file and of build_and_package_native.yml, so a PR that changes them tests its changes.
# It also means a PR can change anything here, so no gate written in this file holds against a fork.
# What holds is the repository's fork-PR approval setting (Settings > Actions > General > "Require
# approval for all external contributors"), which the PR cannot change: a fork PR's run waits until a
# maintainer approves it, after reading everything it changes, workflows included.
#
# A closed PR's job is cancelled by tempo_build_and_package.yml, which runs on pull_request_target and so
# needs no approval to do it. Keep its native_cancel matrix in step with the one here.
# ======

name: Build and Test the Tempo Plugins Natively

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test_native:
    name: Native
    permissions:
      contents: read
    uses: ./.github/workflows/build_and_package_native.yml
    strategy:
      fail-fast: false
      matrix:
        machine:
          - { name: macos, runner: '["self-hosted","tempo-ci","macOS"]' }
          - { name: windows, runner: '["self-hosted","tempo-ci","Windows"]' }
          - { name: linux, runner: '["self-hosted","tempo-ci","Linux"]' }
        unreal_version: [ "5.7", "5.8" ]
    with:
      runner: ${{ matrix.machine.runner }}
      unreal_version: ${{ matrix.unreal_version }}
      project_root: TempoSample
      tempo_root: TempoSample/Plugins/Tempo
      host_project: tempo-sim/TempoSample
      checkout_path: TempoSample/Plugins/Tempo
      cache_branch: main
      gen_rust_api: true
      gen_cpp_api: true
      require_reflected_api: true
      automation_test_filter: Tempo.
      # The same groups the Linux fan-out jobs in tempo_build_and_package.yml run (codegen stays
      # Linux-only: nothing it checks depends on the platform), and sensors, which renders and so runs
      # only here, where there is a GPU.
      # A machine may add sim arguments of its own through TEMPO_SIM_EXTRA_ARGS (a GPU driver workaround, say:
      # CI/Machines/linux/machine.env.example), which the sensors line keeps.
      # Sensors runs without the ROS plugins: its tests load a level, and TempoROS crashes when a node
      # is destroyed, as a level load destroys the world's (an allocator lifetime bug in rclcpp).
      test_commands: |
        python-contract: Scripts/TestPythonAPI.sh contract
        python-core: Scripts/TestPythonAPI.sh core
        python-world: Scripts/TestPythonAPI.sh world
        python-movement: Scripts/TestPythonAPI.sh movement
        python-core-socket: if [ "$RUNNER_OS" = Windows ]; then echo "Skipped: Tempo has no Unix socket transport on Windows."; else TEMPO_SERVER_SOCKET=$TEMPO_CI_SOCKET Scripts/TestPythonAPI.sh core; fi
        python-sensors: TEMPO_SIM_RENDER=1 TEMPO_SIM_EXTRA_ARGS="${TEMPO_SIM_EXTRA_ARGS:-} -DisablePlugins=TempoROS,TempoROSBridge" Scripts/TestPythonAPI.sh sensors
        rust-contract: Scripts/TestRustAPI.sh contract
        rust-integration: Scripts/TestRustAPI.sh integration
        rust-typed: Scripts/TestRustAPI.sh typed
        cpp-contract: Scripts/TestCppAPI.sh contract
        cpp-integration: Scripts/TestCppAPI.sh integration
        cpp-typed: Scripts/TestCppAPI.sh typed

# ======
# Build and Package Workflow for the Tempo plugins.
# This workflow uses the generic Build and Package workflow in the same directory to build and package
# the Tempo plugins within the TempoSample host project.
# ======

name: Build and Package the Tempo Plugins Using the TempoSample Project

on:
  push:
    branches:
      - main
  pull_request_target:
    # closed: only to cancel the PR's native job (native_cancel below).
    types: [opened, synchronize, closed]
  workflow_dispatch:

jobs:
  build_and_package:
    name: Build and Package Tempo Plugins
    # Its test jobs below need it, so they skip with it.
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
      actions: write # prune stale build caches (one per engine version)
    uses: ./.github/workflows/build_and_package.yml
    strategy:
      matrix:
        platform: [ "ubuntu-24.04" ]
        unreal_version: [ "5.7", "5.8" ]
      fail-fast: false
    with:
      platform: ${{ matrix.platform }}
      unreal_version: ${{ matrix.unreal_version }}
      project_root: TempoSample
      tempo_root: TempoSample/Plugins/Tempo
      host_project: tempo-sim/TempoSample
      checkout_path: TempoSample/Plugins/Tempo
      cache_repo_root: TempoSample/Plugins/Tempo
      cache_branch: main
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
      allow_unsafe_pr_checkout: true
      gen_rust_api: true
      gen_cpp_api: true
      # The reflected API's tests below need it in the package; a package without them is
      # a failure here, not several misleading ones there.
      require_reflected_api: true
      automation_test_filter: Tempo.
      # Upload the packaged build for the test jobs below.
      upload_artifact: true
    secrets: inherit

  # The native jobs run from tempo_build_and_test_native.yml, on pull_request. This only cancels a closed
  # PR's native job, which would otherwise still hold the one machine: here, on pull_request_target, a
  # fork PR's cancellation needs no approval. It runs no PR code (cancel_only builds nothing), and its
  # concurrency group matches the build's only if the matrix matches, so keep it in step with that file.
  native_cancel:
    name: Native
    if: github.event.action == 'closed'
    # What the (skipped) build job declares: a caller may not grant a called job less than it asks for.
    permissions:
      contents: read
    uses: ./.github/workflows/build_and_package_native.yml
    strategy:
      matrix:
        machine:
          - { name: macos, runner: '["self-hosted","tempo-ci","macOS"]' }
          - { name: windows, runner: '["self-hosted","tempo-ci","Windows"]' }
          - { name: linux, runner: '["self-hosted","tempo-ci","Linux"]' }
        unreal_version: [ "5.7", "5.8" ]
    with:
      runner: ${{ matrix.machine.runner }}
      unreal_version: ${{ matrix.unreal_version }}
      cancel_only: true

  # One job per Unreal version runs every group, in sequence, against the package built above. A group
  # takes a minute or two, and a job's checkout, 1.3 GB download and toolchain setup about as long, so a
  # job per group spent most of its time setting up. It is still a job of its own, so a flaky group
  # reruns against the uploaded package instead of rebuilding it. The groups are the native jobs'
  # (tempo_build_and_test_native.yml), less sensors, which needs a GPU these runners don't have. The
  # socket line covers the transport; the API behavior it exercises is python-core's.
  test_packaged:
    name: Test Packaged APIs
    needs: build_and_package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unreal_version: [ "5.7", "5.8" ]
    uses: ./.github/workflows/test_packaged.yml
    with:
      # Must match the name build_and_package.yml uploads:
      # "<repo>-<platform>-<unreal_version>-<release_id>", with release_id defaulting to the sha.
      artifact_name: ${{ format('{0}-ubuntu-24.04-{1}-{2}', github.event.repository.name, matrix.unreal_version, github.sha) }}
      name: api
      test_commands: |
        python-contract: Scripts/TestPythonAPI.sh contract
        python-core: Scripts/TestPythonAPI.sh core
        python-world: Scripts/TestPythonAPI.sh world
        python-movement: Scripts/TestPythonAPI.sh movement
        python-core-socket: TEMPO_SERVER_SOCKET=$TEMPO_CI_SOCKET Scripts/TestPythonAPI.sh core
        rust-contract: Scripts/TestRustAPI.sh contract
        rust-integration: Scripts/TestRustAPI.sh integration
        rust-typed: Scripts/TestRustAPI.sh typed
        cpp-contract: Scripts/TestCppAPI.sh contract
        cpp-integration: Scripts/TestCppAPI.sh integration
        cpp-typed: Scripts/TestCppAPI.sh typed
      unreal_version: ${{ matrix.unreal_version }}
      runner: ubuntu-24.04
      setup_rust: true
      # On Linux the C++ client is compiled with clang against libc++, the standard library the
      # shared tempogrpc library is built with.
      apt_packages: clang libc++-dev libc++abi-dev
      checkout_path: TempoSample/Plugins/Tempo
      allow_unsafe_pr_checkout: true
      # Gate fork PRs behind manual approval, same as the build job (this job runs PR code).
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
    secrets: inherit

  # The codegen group tests this repository's own tooling -- the reflected API generators for all three
  # clients, the runtime that serves the Python one, and the schema tools -- against a fixture schema.
  # It needs no sim, so one job rather than one per engine version: nothing it checks depends on the
  # engine. Not a line of the job above because it is the slowest group (~9 minutes) and would set that
  # job's pace. From the artifact it takes only the tempo-sim wheel, for the generated proto modules a
  # checkout lacks until it has been built.
  test_codegen:
    name: Test Codegen
    needs: build_and_package
    permissions:
      contents: read
    uses: ./.github/workflows/test_packaged.yml
    with:
      artifact_name: ${{ format('{0}-ubuntu-24.04-5.8-{1}', github.event.repository.name, github.sha) }}
      name: python-codegen
      test_command: Scripts/TestPythonAPI.sh codegen
      unreal_version: "5.8"
      runner: ubuntu-24.04
      # The Rust half compiles what the Rust generator emits, and skips without cargo; the C++ half
      # compiles and links against the packaged C++ client, which on Linux takes clang and libc++.
      setup_rust: true
      apt_packages: clang libc++-dev libc++abi-dev
      checkout_path: TempoSample/Plugins/Tempo
      allow_unsafe_pr_checkout: true
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
    secrets: inherit

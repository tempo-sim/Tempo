# ======
# Build and Package Workflow for the Tempo plugins.
# This workflow uses the generic Build and Package workflow in the same directory to build and package
# the Tempo plugins within the TempoSample host project.
# ======

name: Build and Package the Tempo Plugins Using the TempoSample Project

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  build_and_package:
    name: Build and Package Tempo Plugins
    permissions:
      contents: read
      pull-requests: write
      actions: write # prune stale build caches (one per engine version)
    uses: ./.github/workflows/build_and_package.yml
    strategy:
      matrix:
        platform: [ "ubuntu-24.04" ]
        unreal_version: [ "5.7", "5.8" ]
      fail-fast: false
    with:
      platform: ${{ matrix.platform }}
      unreal_version: ${{ matrix.unreal_version }}
      project_root: TempoSample
      tempo_root: TempoSample/Plugins/Tempo
      host_project: tempo-sim/TempoSample
      checkout_path: TempoSample/Plugins/Tempo
      cache_repo_root: TempoSample/Plugins/Tempo
      cache_branch: main
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
      allow_unsafe_pr_checkout: true
      gen_rust_api: true
      gen_cpp_api: true
      # The typed-class test jobs below need the classes in the package; a package without them is
      # a failure here, not four misleading ones there.
      require_typed_api: true
      automation_test_filter: Tempo.
      # Upload the packaged build so the Python API test jobs below can fan out against it.
      upload_artifact: true
    secrets: inherit

  # Fan-out (Python): one parallel job per (Unreal version x group). Each downloads the single
  # packaged artifact produced above, installs the generated tempo-sim wheel from it, launches the
  # packaged sim headless, and runs that group's pytest markers. Build once, test in parallel.
  #
  # NOTE: the "sensors" group is intentionally NOT here — sensor-data APIs need a GPU. To enable it,
  # add "sensors" to the matrix below AND give it a GPU runner + render:true (e.g. via matrix
  # `include`), since this matrix's jobs run on the GPU-less default runner.
  test_packaged_python_api:
    name: Test Packaged Python API
    needs: build_and_package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unreal_version: [ "5.7", "5.8" ]
        group: [ "contract", "core", "world", "movement" ]
        # The codegen group tests this repository's own tooling -- the typed class generators for
        # all three clients, the runtime that serves the Python one, and the schema tools -- against
        # a fixture schema. It needs no sim, so one entry rather than one per engine version:
        # nothing it checks depends on the engine. It rides this job to inherit the fork-PR gating
        # and checkout handling below; from the artifact it takes only the tempo-sim wheel, for the
        # generated proto modules a checkout lacks until it has been built.
        include:
          - unreal_version: "5.8"
            group: "codegen"
    uses: ./.github/workflows/test_packaged.yml
    with:
      # Must match the name build_and_package.yml uploads:
      # "<repo>-<platform>-<unreal_version>-<release_id>", with release_id defaulting to the sha.
      artifact_name: ${{ format('{0}-ubuntu-24.04-{1}-{2}', github.event.repository.name, matrix.unreal_version, github.sha) }}
      name: python-${{ matrix.group }}
      test_command: Scripts/TestPythonAPI.sh ${{ matrix.group }}
      unreal_version: ${{ matrix.unreal_version }}
      runner: ubuntu-24.04
      # The Rust half of the codegen group compiles what the Rust generator emits, and skips
      # without cargo; the other groups have no use for it.
      setup_rust: ${{ matrix.group == 'codegen' }}
      checkout_path: TempoSample/Plugins/Tempo
      allow_unsafe_pr_checkout: true
      # Gate fork PRs behind manual approval, same as the build job (this job runs PR code).
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
    secrets: inherit

  # Fan-out (Unix domain socket): the same artifact and the same tests, with the sim listening on a
  # socket instead of a port. One group is enough to cover the transport itself - the API behavior
  # it exercises is already covered by the port-based jobs above.
  test_packaged_socket_transport:
    name: Test Packaged Socket Transport
    needs: build_and_package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unreal_version: [ "5.7", "5.8" ]
    uses: ./.github/workflows/test_packaged.yml
    with:
      artifact_name: ${{ format('{0}-ubuntu-24.04-{1}-{2}', github.event.repository.name, matrix.unreal_version, github.sha) }}
      name: python-core-socket
      test_command: Scripts/TestPythonAPI.sh core
      # Short on purpose: an AF_UNIX path cannot exceed ~104 bytes.
      server_socket: /tmp/tempo-ci.sock
      unreal_version: ${{ matrix.unreal_version }}
      runner: ubuntu-24.04
      checkout_path: TempoSample/Plugins/Tempo
      allow_unsafe_pr_checkout: true
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
    secrets: inherit

  # Fan-out (Rust): the same artifact, the same sim, exercised through the generated Rust client.
  # "contract" compiles the crate (surface check, no sim); "integration" runs against a live sim;
  # "typed" drives the generated class surface, whose crate the packaged build has to contain --
  # which it does, because the package job sets TEMPO_GEN_RUST_API.
  test_packaged_rust_api:
    name: Test Packaged Rust API
    needs: build_and_package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unreal_version: [ "5.7", "5.8" ]
        group: [ "contract", "integration", "typed" ]
    uses: ./.github/workflows/test_packaged.yml
    with:
      artifact_name: ${{ format('{0}-ubuntu-24.04-{1}-{2}', github.event.repository.name, matrix.unreal_version, github.sha) }}
      name: rust-${{ matrix.group }}
      test_command: Scripts/TestRustAPI.sh ${{ matrix.group }}
      unreal_version: ${{ matrix.unreal_version }}
      runner: ubuntu-24.04
      python_version: ''     # Rust groups don't need Python
      setup_rust: true
      checkout_path: TempoSample/Plugins/Tempo
      allow_unsafe_pr_checkout: true
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
    secrets: inherit

  test_packaged_cpp_api:
    name: Test Packaged C++ API
    needs: build_and_package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        unreal_version: [ "5.7", "5.8" ]
        group: [ "contract", "integration", "typed" ]
    uses: ./.github/workflows/test_packaged.yml
    with:
      artifact_name: ${{ format('{0}-ubuntu-24.04-{1}-{2}', github.event.repository.name, matrix.unreal_version, github.sha) }}
      name: cpp-${{ matrix.group }}
      test_command: Scripts/TestCppAPI.sh ${{ matrix.group }}
      unreal_version: ${{ matrix.unreal_version }}
      runner: ubuntu-24.04
      python_version: ''     # C++ groups need only cmake and a compiler, both in the runner image
      checkout_path: TempoSample/Plugins/Tempo
      allow_unsafe_pr_checkout: true
      environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-environment' || '' }}
    secrets: inherit
